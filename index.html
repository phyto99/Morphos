    generate:()=>{const cases=[{q:"\"The philosopher debated with the student. She left angry.\"\nIn Ithkuil, how would you mark which referent 'she' points to without ambiguity?",accept:['proximate','obviative','reference','anaphora','most recent','earlier','marking'],expl:"Ithkuil uses proximate/obviative distinction: the most recently introduced participant (student) is proximate; the earlier one (philosopher) is obviative. You'd use the appropriate nominal marker to disambiguate."},{q:"\"It rained. Therefore the flowers bloomed.\"\nWhat Ithkuil device links these two propositions causally?",accept:['connective','causal','morphology','affix','case','consequential','because'],expl:"A causal connective morpheme (or the Resultative case RSL) links the propositions, encoding the causal dependency directly in the word rather than requiring a separate conjunction."},{q:"\"I dreamed that the world ended. But it didn't.\"\nWhich two parameters together encode this contrast?",accept:['counterfactual','CNT','mood','imaginative','IMG','validation','dream'],expl:"Imaginative Validation (IMG) + Counterfactual Mood (CNT): IMG marks the dream-source, CNT marks the speaker's knowledge that it's false."}];const c=_s(cases);return {question:c.q,hint:'Think about Ithkuil grammatical devices rather than English words.',accept:c.accept,explanation:c.expl};}},
  connective_chain:{label:"Connective Morphology",cat:"Input",module:12,phase:4,engine:'INPUT',
    generate:()=>{const cases=[{q:"How would Ithkuil encode the logical relation between these two propositions:\n\"Because she studied, she passed.\"\nName the Ithkuil parameter or device involved.",accept:['causative','resultative','RSL','case','causal','morphology','affix','connective'],expl:"The Resultative case (RSL) on 'passing' marks it as the result; alternatively a causal connective affix links the two formatives directly without needing 'because'"},{q:"\"Either X or Y, but not both\" — how is this disjunction encoded in Ithkuil?",accept:['bias','mood','connective','disjunctive','exclusive','affix','particle'],expl:"Exclusive disjunction is encoded via a logical connective morpheme/affix, not a separate word like 'or'"},{q:"\"Not only X but also Y\" — what mechanism allows Ithkuil to pack both concession and addition into one word?",accept:['bias','affix','corrective','additive','morpheme','compound'],expl:"A Corrective bias marker (COR) combined with an additive affix can encode this — Ithkuil packs logical relations into morphology rather than separate words"}];const c=_s(cases);return {question:c.q,hint:'Remember: Ithkuil encodes in morphology what English encodes with separate words.',accept:c.accept,explanation:c.expl};}},
  meta_which_puzzle:{label:"Meta: Which Puzzle Trains This?",cat:"Input",module:11,phase:4,engine:'INPUT',
    generate:()=>{const cases=[{q:"You struggle to distinguish Monadic from Noumenal Perspective.\nWhich puzzle type most directly trains this?",accept:['perspective','param id','identification','sorter','ladder','abstraction','discrimination'],expl:"Perspective Sorter or Abstraction Ladder — both directly train M/P/N/A discrimination"},{q:"You can identify individual parameters but fail when building complete forms.\nWhich puzzle type addresses this gap?",accept:['build','construction','full decode','multi','assemble','form'],expl:"Build puzzles and Full Decode (Multi) — construction requires holding all parameters simultaneously"},{q:"You know parameter values in isolation but freeze in timed contexts.\nWhat should you drill?",accept:['speed','sprint','fluency','timed','flash'],expl:"Speed drills — timed recognition exercises build automatic retrieval under pressure"}];const c=_s(cases);return {question:c.q,hint:'Think about what cognitive operation each puzzle type trains.',accept:c.accept,explanation:c.expl};}},
  flashcard_rev:{label:"Flashcard: ID → Label",cat:"Speed",module:11,phase:4,engine:'SPEED',
    generate:()=>{const pk=_s(Object.keys(PARAMS));const p=PARAMS[pk];const v=_s(p.values);return _q(`${p.label}: "${v.id}" — what is this value called?`,{id:v.id,label:v.label},_dist(v,p.values));}},
});

function UniversalRunner({defId,def,onBack,synOn,onLmUpdate,lm}){
  const[score,setScore]=useState({correct:0,total:0});
  // onScore receives (correct, ms) — ms is optional (MCQ passes it, others don't)
  const handleScore=useCallback((correct,ms)=>{
    setScore(s=>({correct:s.correct+(correct?1:0),total:s.total+1}));
    // Map puzzle back to param keys it trains, pass ms for per-concept FSRS update
    const paramKeys=Object.entries(PARAM_DRILLS)
      .filter(([,ids])=>ids.includes(defId)).map(([pk])=>pk);
    onLmUpdate&&onLmUpdate(paramKeys,correct,ms);
  },[defId,onLmUpdate]);
  const catMeta=REG_CAT_META[def.cat]||{color:'#6e7099'};
  const header=(
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <button className="btn btn-ghost btn-sm" onClick={onBack}>← Hall</button>
        <span className="phase-tag" style={{background:catMeta.color+'22',color:catMeta.color}}>{def.cat}</span>
        <span style={{fontSize:11,color:'var(--muted)'}}>Module {def.module} · Phase {def.phase}</span>
      </div>
      <InfoPill label="Score" value={`${score.correct}/${score.total}`} color="#22c55e"/>
    </div>
  );
  if(def.engine==='MCQ')   return <MCQEngine    def={def} onScore={handleScore} synOn={synOn} lm={lm} headerSlot={header}/>;
  if(def.engine==='MATCH') return <MatchEngine   def={def} onScore={handleScore} headerSlot={header}/>;
  if(def.engine==='SORT')  return <SortEngine    def={def} onScore={handleScore} headerSlot={header}/>;
  if(def.engine==='SPEED') return <SpeedEngine   def={def} onScore={handleScore} synOn={synOn} lm={lm} headerSlot={header}/>;
  if(def.engine==='BUILD') return <BuildEngine   def={def} onScore={handleScore} headerSlot={header}/>;
  if(def.engine==='MULTI') return <MultiEngine   def={def} onScore={handleScore} headerSlot={header}/>;
  if(def.engine==='VISUAL')return <VisualEngine  def={def} onScore={handleScore} headerSlot={header}/>;
  if(def.engine==='INPUT')   return <InputEngine   def={def} onScore={handleScore} headerSlot={header}/>;
  if(def.engine==='SENTENCE'){
    const ex=SENTENCE_EX.find(s=>s.id===def.sentenceId);
    if(!ex)return <div>{header}<p style={{color:'var(--muted)',fontSize:12}}>Exercise not found.</p></div>;
    return <SentenceEngine ex={ex} onScore={handleScore} onBack={onBack}/>;
  }
  return <div>{header}<p style={{color:'var(--muted)',fontSize:12}}>Unknown engine: {def.engine}</p></div>;
}

    sudoku:    {typeLabel:"Full Pipeline",   typeColor:"#92400e",module:8,phase:3,total:1},

    {id:"case",      icon:"▷",color:"#1d4ed8",label:"Case Detective",   count:CASE_CHAINS.length,  desc:"Assign semantic cases to all NPs in a complex narrative sentence"},
    {id:"tree",      icon:"⊙",color:"#c2410c",label:"Root Family Tree", count:ROOTS.length,         desc:"Excavate the 27-node semantic tree of any Ithkuil root"},

    {id:"sudoku",    icon:"⊞",color:"#6d28d9",label:"Morphological Sudoku",count:1,                desc:"Satisfy Configuration×Affiliation grid constraints — logic puzzle"},
    {id:"sorter",    icon:"⊿",color:"#0891b2",label:"Perspective Sorter",count:8,                  desc:"Drag-assign eight scenarios to their correct M/P/N/A perspective bucket"},
    {id:"valchain",  icon:"◎",color:"#0f766e",label:"Validation Chain",  count:6,                  desc:"Match six speaker stances to their correct Validation evidential category"},
    {id:"formparse", icon:"◇",color:"#7e22ce",label:"Form Dissection",   count:3,                  desc:"Given a complete Ithkuil form, identify each slot and explain its value"},
  ];

  if(regActive) return <UniversalRunner defId={regActive.id} def={regActive.def} onBack={()=>setRegActive(null)} synOn={synOn} onLmUpdate={onLmUpdate} lm={lm}/>;

  if(!active) return(

          {[{id:'classic',label:'Classic'},{id:'adaptive',label:'⟳ Adaptive'},{id:'drill',label:'Library'}].map(t=>(

  /* ---- Situation → Params ---- */
  if(active==="situations"){
    const ex=SIT_EXERCISES[sitIdx];
    const targetKeys=Object.keys(ex.target).filter(k=>!["root","stem","pattern"].includes(k));
    return(
      <div>
        <ExerciseHeader puzzleId="situations" idx={sitIdx} onBack={()=>{setSitSubmitted(false);setSitAnswers({});}}/>
        <div style={{display:'flex',gap:4,marginBottom:12}}>{SIT_EXERCISES.map((_,i)=><div key={i} style={{flex:1,height:4,borderRadius:2,background:i<sitIdx?'#4338ca':i===sitIdx?'#818cf8':'var(--border)'}}/>)}</div>
        <div className="card fade-up" key={ex.id}>
          <div style={{marginBottom:10}}>
            <h3 style={{fontSize:14,color:'var(--bright)',marginBottom:6}}>{ex.title}</h3>
            <p style={{fontSize:13,lineHeight:1.8,color:'var(--text)'}}>{ex.scenario}</p>
          </div>
          {/* Configuration visual if applicable */}
          {ex.target.configuration&&(
            <div style={{display:'flex',gap:8,marginBottom:10,flexWrap:'wrap'}}>
              {PARAMS.configuration.values.slice(0,5).map(v=>(
                <div key={v.id} style={{cursor:'pointer',opacity:sitAnswers.configuration===v.id?1:0.4,transition:'opacity .15s'}}
                  onClick={()=>setSitAnswers(p=>({...p,configuration:v.id}))}>
                  <ConfigScenario configId={v.id} size={60}/>
                  <div style={{fontSize:8,textAlign:'center',color:PARAMS.configuration.hex,marginTop:2}}>{v.label}</div>
                </div>
              ))}
            </div>
          )}
          <div className="flex-col gap8" style={{marginBottom:10}}>
            {targetKeys.map(k=>{
              if(k==="configuration") return null;// handled above
              const p2=PARAMS[k]; if(!p2) return null;
              return(
                <div key={k}>
                  <div style={{fontSize:9,fontWeight:700,color:p2.hex,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>{p2.label}</div>
                  <ParamStrip paramKey={k} selectedId={sitAnswers[k]} onChange={v=>{
                    if(synOn&&TONE_MAP[v])playTone(TONE_MAP[v],0.15);
                    setSitAnswers(p=>({...p,[k]:v}));
                    setSitSubmitted(false);
                  }} synOn={synOn} showLabel={false}/>
                </div>
              );
            })}
          </div>
          {!sitSubmitted&&(
            <button className="btn btn-primary" onClick={()=>{
              const allCorrect=Object.entries(ex.target).every(([k,v])=>sitAnswers[k]===v);
              setScore(s=>({correct:s.correct+(allCorrect?1:0),total:s.total+1}));
              setSitSubmitted(true);
            }} disabled={targetKeys.filter(k=>k!=="configuration"||ex.target.configuration).every(k=>!sitAnswers[k])&&!sitAnswers.configuration}>
              Submit Answer
            </button>
          )}
          {sitSubmitted&&(
            <div className="card fade-up" style={{borderColor:'#4338ca44',marginTop:8}}>
              <div style={{display:'flex',flexWrap:'wrap',gap:6,marginBottom:8}}>
                {Object.entries(ex.target).map(([k,v])=>{
                  const correct=sitAnswers[k]===v;
                  return<span key={k} style={{fontSize:11,padding:'2px 8px',borderRadius:4,
                    background:correct?'rgba(34,197,94,.15)':'rgba(239,68,68,.15)',
                    color:correct?'#22c55e':'#ef4444'}}>
                    {PARAMS[k]?.label||k}: {correct?`✓ ${v}`:` ✗ ${sitAnswers[k]||'?'} → ${v}`}
                  </span>;
                })}
              </div>
              <p style={{fontSize:12,lineHeight:1.7,color:'var(--muted)'}}>{ex.expl}</p>
              <button className="btn btn-primary btn-sm" style={{marginTop:10}} onClick={()=>{
                setSitIdx(i=>(i+1)%SIT_EXERCISES.length);setSitAnswers({});setSitSubmitted(false);
              }}>Next →</button>
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ---- Parameter Clash ---- */
  if(active==="clash"){
    const pair=CLASH_PAIRS[clashIdx];
    return(
      <div>
        <ExerciseHeader puzzleId="clash" idx={clashIdx} onBack={()=>{setClashSubmitted(false);setClashSide(null);}}/>
        <div className="card fade-up" key={pair.id} style={{marginBottom:10,borderColor:'#0d948844'}}>
          <h3 style={{fontSize:14,color:'var(--bright)',marginBottom:4}}>{pair.title}</h3>
          <p style={{fontSize:11,color:'var(--muted)',marginBottom:10}}>These two situations differ by exactly one parameter: <strong style={{color:'#0d9488'}}>{PARAMS[pair.diffParam]?.label||pair.diffParam}</strong>. Identify which is Situation A and which is Situation B, then assign the correct value.</p>
          <div className="g2">
            {[pair.A,pair.B].map((side,si)=>{
              const label=["A","B"][si];
              const selected=clashSide===label;
              return(
                <div key={label} className="card2" style={{cursor:'pointer',borderColor:selected?'#0d9488':'var(--border)',background:selected?'rgba(13,148,136,.08)':'var(--card2)'}}
                  onClick={()=>{setClashSide(label);setClashSubmitted(false);}}>
                  <div style={{fontWeight:700,color:'#0d9488',marginBottom:6}}>Situation {label}</div>
                  <p style={{fontSize:12,lineHeight:1.7}}>{side.scenario}</p>
                </div>
              );
            })}
          </div>
        </div>
        {clashSide&&!clashSubmitted&&(
          <div className="fade-up">
            <div style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>What value of <strong style={{color:PARAMS[pair.diffParam]?.hex}}>{PARAMS[pair.diffParam]?.label}</strong> applies to Situation {clashSide}?</div>
            <ParamStrip paramKey={pair.diffParam} selectedId={null}
              onChange={v=>{
                const correct=v===(clashSide==="A"?pair.A.target[pair.diffParam]:pair.B.target[pair.diffParam]);
                setClashSubmitted({chosen:v,correct});
                setScore(s=>({correct:s.correct+(correct?1:0),total:s.total+1}));
                if(synOn)playTone(correct?660:220,0.2,correct?'sine':'sawtooth');
              }} synOn={synOn}/>
          </div>
        )}
        {clashSubmitted&&(
          <div className="card fade-up" style={{borderColor:clashSubmitted.correct?'#22c55e44':'#ef444444'}}>
            <div style={{fontWeight:600,color:clashSubmitted.correct?'#22c55e':'#ef4444',marginBottom:6}}>
              {clashSubmitted.correct?"✓ Correct":"✗ Incorrect"}
            </div>
            <p style={{fontSize:12,lineHeight:1.7,color:'var(--muted)'}}>{pair.expl}</p>
            <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={()=>{
              setClashIdx(i=>(i+1)%CLASH_PAIRS.length);setClashSide(null);setClashSubmitted(false);
            }}>Next Pair →</button>
          </div>
        )}
      </div>
    );
  }

  /* ---- Abstraction Ladder ---- */
  if(active==="ladder"){
    const ladder=ABST_LADDERS[abIdx];
    const rung=ladder.rungs[abRung];
    const perColors={"M":"#7c3aed","P":"#6d28d9","N":"#8b5cf6","A":"#a78bfa"};
    return(
      <div>
        <ExerciseHeader puzzleId="ladder" idx={abIdx} onBack={()=>{}}/>
        <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
          {ABST_LADDERS.map((l,i)=><button key={i} className={`btn btn-sm ${abIdx===i?'btn-primary':'btn-ghost'}`}
            onClick={()=>{setAbIdx(i);setAbRung(0);}}>{l.rootName}</button>)}
        </div>
        <div style={{display:'flex',gap:3,marginBottom:16}}>
          {ladder.rungs.map((r,i)=>(
            <div key={i} onClick={()=>setAbRung(i)} style={{flex:1,cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
              <div style={{width:'100%',height:4,borderRadius:2,background:i<=abRung?'#4338ca':'var(--border)',transition:'background .3s'}}/>
              <div style={{fontSize:8,color:i===abRung?perColors[r.perspective]:'var(--muted)',fontWeight:i===abRung?700:400}}>{PARAMS.perspective.values.find(v=>v.id===r.perspective)?.label}</div>
            </div>
          ))}
        </div>
        <div className="card fade-up" key={`${abIdx}-${abRung}`} style={{borderColor:`${perColors[rung.perspective]}44`}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
            <div>
              <div style={{fontSize:9,color:perColors[rung.perspective],fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>
                {PARAMS.perspective.values.find(v=>v.id===rung.perspective)?.label} Perspective
              </div>
              <p style={{fontSize:13,fontFamily:'Fraunces',fontStyle:'italic',color:'var(--bright)',lineHeight:1.6}}>{rung.scenario}</p>
            </div>
            <div style={{width:50,height:50,borderRadius:'50%',background:perColors[rung.perspective]+'22',border:`2px solid ${perColors[rung.perspective]}`,
              display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,color:perColors[rung.perspective],flexShrink:0}}>
              {PARAMS.perspective.values.find(v=>v.id===rung.perspective)?.icon}
            </div>
          </div>
          <p style={{fontSize:12,lineHeight:1.7,color:'var(--muted)'}}>{rung.desc}</p>
          <div style={{marginTop:10,padding:'8px 12px',borderRadius:6,background:'var(--surface)',fontSize:11,fontFamily:'IBM Plex Mono',color:perColors[rung.perspective]}}>
            Root: {ladder.root} · Perspective: {rung.perspective} → {buildForm({...defaultP(),root:ladder.root,perspective:rung.perspective})}
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',marginTop:10}}>
          <button className="btn btn-ghost" onClick={()=>setAbRung(r=>Math.max(0,r-1))} disabled={abRung===0}>← More Concrete</button>
          <button className="btn btn-primary" onClick={()=>{
            if(abRung<ladder.rungs.length-1){setAbRung(r=>r+1);if(synOn)playTone(PARAMS.perspective.values[abRung+1]?.freq,0.2,'sine');}
          }} disabled={abRung===ladder.rungs.length-1}>More Abstract →</button>
        </div>
      </div>
    );
  }

  /* ---- Bias Encoder ---- */
  if(active==="bias"){
    const ex=BIAS_EXERCISES[biasIdx];
    return(
      <div>
        <ExerciseHeader puzzleId="bias" idx={biasIdx} onBack={()=>{setBiasSubmitted(false);setBiasAnswer(null);}}/>
        <div className="card fade-up" key={ex.id} style={{marginBottom:10,borderColor:'#be185d44'}}>
          <h3 style={{fontSize:14,color:'var(--bright)',marginBottom:6}}>{ex.title}</h3>
          <p style={{fontSize:13,lineHeight:1.8,fontFamily:'Fraunces',fontStyle:'italic'}}>{ex.scenario}</p>
        </div>
        <ParamStrip paramKey="bias" selectedId={biasAnswer} onChange={v=>{
          setBiasAnswer(v);setBiasSubmitted(false);
          if(synOn&&TONE_MAP[v])playTone(TONE_MAP[v],0.2,'sine');
        }} synOn={synOn}/>
        {biasAnswer&&!biasSubmitted&&(
          <button className="btn btn-primary btn-sm" style={{marginTop:10}} onClick={()=>{
            setScore(s=>({correct:s.correct+(biasAnswer===ex.target?1:0),total:s.total+1}));
            setBiasSubmitted(true);
          }}>Submit Answer</button>
        )}
        {biasSubmitted&&(
          <div className="card fade-up" style={{marginTop:10,borderColor:biasAnswer===ex.target?'#22c55e44':'#ef444444'}}>
            <div style={{fontWeight:600,color:biasAnswer===ex.target?'#22c55e':'#ef4444',marginBottom:6}}>
              {biasAnswer===ex.target?"✓ Correct":` ✗ Target: ${ex.target}`}
            </div>
            <p style={{fontSize:12,lineHeight:1.7,color:'var(--muted)'}}>{ex.expl}</p>
            <p style={{fontSize:11,color:'var(--muted)',marginTop:6}}>Alternatives that could also apply: {ex.alt.join(', ')}</p>
            <button className="btn btn-primary btn-sm" style={{marginTop:8}} onClick={()=>{
              setBiasIdx(i=>(i+1)%BIAS_EXERCISES.length);setBiasAnswer(null);setBiasSubmitted(false);
            }}>Next →</button>
          </div>
        )}
      </div>
    );
  }

  if(active==="case")  return <div><ExerciseHeader puzzleId="case" idx={0} onBack={()=>{}}/><CaseDetective/></div>;
  if(active==="tree")  return <div><ExerciseHeader puzzleId="tree" idx={0} onBack={()=>{}}/><RootFamilyTree lm={lm}/></div>;
  if(active==="sprint") return <div><ExerciseHeader puzzleId="sprint" idx={0} onBack={()=>{}}/><CompressionSprint synOn={synOn}/></div>;
  if(active==="sudoku") return <div><ExerciseHeader puzzleId="sudoku" idx={0} onBack={()=>{}}/><MorphSudoku/></div>;
  if(active==="sorter") return <div><ExerciseHeader puzzleId="sorter" idx={0} onBack={()=>{}}/><PerspectiveSorter synOn={synOn}/></div>;
  if(active==="valchain") return <div><ExerciseHeader puzzleId="valchain" idx={0} onBack={()=>{}}/><ValidationChain synOn={synOn}/></div>;
  if(active==="formparse") return <div><ExerciseHeader puzzleId="formparse" idx={0} onBack={()=>{}}/><FormDissection synOn={synOn}/></div>;
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   LAYER 9 — SYNESTHETIC TRAINING MODE
   The primary brain-training interface: color+sound+spatial
   ══════════════════════════════════════════════════════════════════ */
function SynestheticTrainer({synOn,setSynOn}){
  const[activeParam,setAP]=useState("configuration");
  const[mode,setMode]=useState("color");// color | spatial | chord | quiz
  const[quizQ,setQuizQ]=useState(null);
  const[quizAns,setQuizAns]=useState(null);
  const[quizScore,setQuizScore]=useState({c:0,t:0});
  const p=PARAMS[activeParam];

  const genQuizQ=()=>{
    const keys=Object.keys(PARAMS);
    const pk=keys[Math.floor(Math.random()*keys.length)];
    const pdata=PARAMS[pk];
    const correct=pdata.values[Math.floor(Math.random()*pdata.values.length)];
    const wrongs=pdata.values.filter(v=>v.id!==correct.id).slice(0,3).map(v=>({...v,correct:false}));
    const all=[{...correct,correct:true},...wrongs].sort(()=>Math.random()-.5);
    setQuizQ({paramKey:pk,correct,options:all});
    setQuizAns(null);
    // Play the tone — learner must identify the parameter value
    if(synOn) setTimeout(()=>playTone(correct.freq,0.4,'sine',0.12),200);
  };

  return(
    <div className="flex-col gap14">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div>
          <h3 style={{fontSize:14,color:'var(--bright)',marginBottom:2}}>Synesthetic Training Mode</h3>
          <p style={{fontSize:11,color:'var(--muted)'}}>Build colour-sound-spatial-conceptual mappings into procedural memory.</p>
        </div>
        <label style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer'}}>
          <span style={{fontSize:11,color:'var(--muted)'}}>Audio</span>
          <div onClick={()=>setSynOn(!synOn)} style={{width:36,height:20,borderRadius:10,background:synOn?'var(--accent)':'var(--border)',position:'relative',cursor:'pointer',transition:'background .2s'}}>
            <div style={{width:14,height:14,borderRadius:'50%',background:'white',position:'absolute',top:3,left:synOn?19:3,transition:'left .2s'}}/>
          </div>
        </label>
      </div>

      {/* Mode tabs */}
      <div style={{display:'flex',gap:6,borderBottom:'1px solid var(--border)',paddingBottom:10}}>
        {["color","spatial","chord","quiz"].map(m=>(
          <button key={m} className={`btn btn-sm ${mode===m?'btn-primary':'btn-ghost'}`} onClick={()=>setMode(m)}>
            {m==="color"?"Color Matrix":m==="spatial"?"Spatial Map":m==="chord"?"Chord Builder":"Ear Training Quiz"}
          </button>
        ))}
      </div>

      {/* COLOR MATRIX MODE */}
      {mode==="color"&&(
        <div>
          <p style={{fontSize:11,color:'var(--muted)',marginBottom:12,lineHeight:1.7}}>
            Every parameter dimension has a dedicated hue family. Every value within that dimension occupies a distinct shade.
            Hover/click to play the associated tone. Your goal: develop instant colour-to-concept recognition.
          </p>
          {Object.entries(PARAMS).map(([k,pdata])=>(
            <div key={k} style={{marginBottom:8}}>
              <div style={{fontSize:9,fontWeight:700,color:pdata.hex,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4,display:'flex',justifyContent:'space-between'}}>
                <span>{pdata.label}</span><span style={{color:'#3a3a5a',fontStyle:'italic'}}>{pdata.synNote}</span>
              </div>
              <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                {pdata.values.map(v=>(
                  <div key={v.id} onClick={()=>{if(synOn)playTone(v.freq,0.25,'sine');}}
                    className="tip-wrap" style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,cursor:'pointer',padding:'6px 8px',borderRadius:6,background:v.hue+'22',border:`1px solid ${v.hue}55`,transition:'all .15s',minWidth:60}}
                    onMouseEnter={()=>{if(synOn)playTone(v.freq,0.1,'sine',0.05);}}>
                    <div style={{width:24,height:24,borderRadius:4,background:v.hue}}/>
                    <div style={{fontSize:9,color:v.hue,fontWeight:600}}>{v.icon}</div>
                    <div style={{fontSize:8,color:'var(--muted)',textAlign:'center'}}>{v.label}</div>
                    <div style={{fontSize:8,color:'#3a3a5a'}}>{Math.round(v.freq)}Hz</div>
                    <div className="tip">{v.desc}</div>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* SPATIAL MAP MODE */}
      {mode==="spatial"&&(
        <div>
          <p style={{fontSize:11,color:'var(--muted)',marginBottom:12,lineHeight:1.7}}>
            Each parameter occupies a distinct region in conceptual space. Configuration is horizontal arrangement (X axis).
            Perspective is depth into abstraction (Z axis). Extension is boundary width. Case is directional orientation.
            Train yourself to associate spatial position with grammatical function.
          </p>
          <svg width="100%" viewBox="0 0 600 340" style={{background:'var(--surface)',borderRadius:8,border:'1px solid var(--border)'}}>
            {/* Axes */}
            <line x1={50} y1={290} x2={550} y2={290} stroke="#1e1e35" strokeWidth={1}/>
            <line x1={50} y1={290} x2={50} y2={30} stroke="#1e1e35" strokeWidth={1}/>
            <text x={300} y={318} textAnchor="middle" fill="#3a3a5a" fontSize={9} fontFamily="IBM Plex Sans">← CONFIGURATION (horizontal arrangement) →</text>
            <text x={22} y={180} textAnchor="middle" fill="#3a3a5a" fontSize={9} fontFamily="IBM Plex Sans" transform="rotate(-90,22,180)">← CONCRETE · ABSTRACT →</text>
            {/* Configuration row */}
            {PARAMS.configuration.values.map((v,i)=>{
              const x=70+i*54, y=260;
              return<g key={v.id} onClick={()=>{if(synOn)playTone(v.freq,0.2,'sine');}}>
                <rect x={x-20} y={y-14} width={40} height={24} rx={4} fill={v.hue+'33'} stroke={v.hue+'66'}/>
                <text x={x} y={y+2} textAnchor="middle" fill={v.hue} fontSize={10} fontFamily="IBM Plex Mono" fontWeight="600">{v.icon}</text>
                <text x={x} y={y+18} textAnchor="middle" fill={v.hue} fontSize={7} fontFamily="IBM Plex Sans">{v.label.slice(0,6)}</text>
              </g>;
            })}
            {/* Perspective column */}
            {PARAMS.perspective.values.map((v,i)=>{
              const x=580, y=260-i*60;
              return<g key={v.id} onClick={()=>{if(synOn)playTone(v.freq,0.2,'sine');}}>
                <rect x={x-38} y={y-14} width={50} height={22} rx={4} fill={v.hue+'33'} stroke={v.hue+'66'}/>
                <text x={x-13} y={y+2} textAnchor="middle" fill={v.hue} fontSize={10} fontFamily="IBM Plex Mono">{v.icon}</text>
                <text x={x-13} y={y+15} textAnchor="middle" fill={v.hue} fontSize={7}>{v.label}</text>
              </g>;
            })}
            {/* Extension - middle horizontal band */}
            {PARAMS.extension.values.map((v,i)=>{
              const x=80+i*77, y=170;
              return<g key={v.id} onClick={()=>{if(synOn)playTone(v.freq,0.2,'sine');}}>
                <ellipse cx={x} cy={y} rx={28} ry={12} fill={v.hue+'22'} stroke={v.hue+'55'}/>
                <text x={x} y={y+3} textAnchor="middle" fill={v.hue} fontSize={9} fontFamily="IBM Plex Mono">{v.icon}</text>
                <text x={x} y={y+22} textAnchor="middle" fill={v.hue} fontSize={7}>{v.label.slice(0,5)}</text>
              </g>;
            })}
            {/* Labels */}
            <text x={300} y={148} textAnchor="middle" fill="#2a2a4a" fontSize={8}>EXTENSION ←──────→</text>
            <text x={590} y={24} textAnchor="middle" fill="#2a2a4a" fontSize={8}>PERSPECTIVE</text>
          </svg>
        </div>
      )}

      {/* CHORD BUILDER MODE */}
      {mode==="chord"&&(
        <div>
          <p style={{fontSize:11,color:'var(--muted)',marginBottom:12,lineHeight:1.7}}>
            The Ca complex is a chord: Configuration + Affiliation + Perspective played simultaneously.
            Build Ca combinations and hear them as musical chords. Train your ear to recognize Ca gestalts.
          </p>
          <div className="g3 mb12">
            {["configuration","affiliation","perspective"].map(k=>(
              <div key={k}>
                <div style={{fontSize:9,fontWeight:700,color:PARAMS[k].hex,textTransform:'uppercase',marginBottom:6}}>{PARAMS[k].label}</div>
                <div className="flex-col gap3">
                  {PARAMS[k].values.map(v=>(
                    <button key={v.id} className="btn btn-xs" onClick={()=>{
                      if(synOn) playTone(v.freq,0.3,'sine');
                    }} style={{justifyContent:'flex-start',background:v.hue+'18',color:v.hue,border:`1px solid ${v.hue}33`}}>
                      {v.icon} {v.label}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
          <div className="card2" style={{marginBottom:10}}>
            <div style={{fontSize:10,color:'var(--muted)',marginBottom:8}}>Play a full Ca chord (select one from each row, then hit Play Chord):</div>
            <div className="flex-col gap8">
              {["configuration","affiliation","perspective"].map(k=>(
                <ParamStrip key={k} paramKey={k} selectedId={null} onChange={()=>{}} synOn={false}/>
              ))}
            </div>
          </div>
          <div style={{fontSize:10,color:'#3a3a5a',lineHeight:1.7}}>
            In Ithkuil, a single Ca morpheme encodes five dimensions simultaneously. Training your ear to hear
            the individual tones within a chord builds the ability to decompose a Ca form into its five component parameters.
            This is the musical analogy of morphological parsing.
          </div>
        </div>
      )}

      {/* EAR TRAINING QUIZ */}
      {mode==="quiz"&&(
        <div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
            <p style={{fontSize:11,color:'var(--muted)'}}>A tone plays. Identify which parameter value it encodes.</p>
            <div style={{fontSize:12,color:'#22c55e',fontFamily:'IBM Plex Mono'}}>{quizScore.c}/{quizScore.t}</div>
          </div>
          {!quizQ&&<button className="btn btn-primary" onClick={genQuizQ}>▶ Play Tone &amp; Identify</button>}
          {quizQ&&(
            <div className="fade-up">
              <div style={{marginBottom:10}}>
                <div style={{fontSize:11,color:'var(--muted)',marginBottom:6}}>
                  Parameter: <strong style={{color:PARAMS[quizQ.paramKey].hex}}>{PARAMS[quizQ.paramKey].label}</strong>
                </div>
                <button className="btn btn-ghost btn-sm" onClick={()=>synOn&&playTone(quizQ.correct.freq,0.5,'sine',0.12)}>
                  ▶ Replay Tone ({Math.round(quizQ.correct.freq)}Hz)
                </button>
              </div>
              <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                {quizQ.options.map(opt=>(
                  <button key={opt.id} onClick={()=>{
                    if(quizAns) return;
                    setQuizAns(opt.id);
                    setQuizScore(s=>({c:s.c+(opt.correct?1:0),t:s.t+1}));
                    if(synOn) playTone(opt.correct?880:165,0.3,opt.correct?'sine':'sawtooth',0.1);
                  }} style={{padding:'8px 14px',borderRadius:6,border:`1px solid ${
                    !quizAns?opt.hue+'55':opt.correct?'#22c55e':quizAns===opt.id?'#ef4444':opt.hue+'33'}`,
                    background:!quizAns?opt.hue+'18':opt.correct?'rgba(34,197,94,.15)':quizAns===opt.id?'rgba(239,68,68,.1)':opt.hue+'08',
                    color:!quizAns?opt.hue:opt.correct?'#22c55e':quizAns===opt.id?'#ef4444':opt.hue+'88',
                    cursor:quizAns?'default':'pointer',fontSize:12,fontWeight:500}}>
                    {opt.icon} {opt.label}
                  </button>
                ))}
              </div>
              {quizAns&&(
                <div style={{marginTop:10}}>
                  <p style={{fontSize:11,color:'var(--muted)',marginBottom:8}}>
                    {quizQ.options.find(o=>o.id===quizAns)?.correct?"✓ Correct!":"✗ That was "+quizQ.correct.label+". "}
                    {quizQ.correct.desc}
                  </p>
                  <button className="btn btn-primary btn-sm" onClick={genQuizQ}>Next Tone →</button>
                </div>
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   LAYER 10 — PHILOSOPHICAL FRAMEWORK PANEL
   ══════════════════════════════════════════════════════════════════ */
function PhiloFramework(){
  const[stage,setStage]=useState(0);
  const stages=[
    {id:0,label:"1. Epistemological Problem",color:"#b91c1c",
     title:"The Epistemological Problem",
     body:`Conventional language learning assumes a new language maps onto an existing cognitive structure — that "chien" substitutes for "dog," and grammar adjusts the container without altering the cargo. Ithkuil IV invalidates this assumption entirely.\n\nIthkuil does not translate meaning. It engineers it from ontological primitives. The learner who approaches Ithkuil as a code for English will fail at the level of their first morphological assembly. Every word form requires resolving at least twelve conceptual dimensions that natural languages leave systematically ambiguous.`,
     key:"Before expressing anything in Ithkuil, you must have done the conceptual work first. Language production is the final step, not the starting point."},
    {id:1,label:"2. Semantic Engineer Paradigm",color:"#c2410c",
     title:"The Semantic Engineer Paradigm",
     body:`The ideal Ithkuil learner is not a language student but a semantic engineer — a person who:\n\n• Perceives reality as a field of structured conceptual events\n• Decomposes events into their fundamental ontological parameters\n• Selects morphological tools to encode each parameter precisely\n• Assembles those tools into a compressed expression\n• Verifies the form faithfully reconstructs the intended structure for a listener\n\nThis is not translation. It is conceptual architecture. The question shifts from "what is the word for X?" to "what are the twelve parameters of X, and which morphological tools encode each one?"`,
     key:"Semantic engineering precedes linguistic expression. The form is the last thing you produce, not the first."},
    {id:2,label:"3. Cognitive Ontology",color:"#0f766e",
     title:"What Ithkuil Treats as Primary",
     body:`Every Ithkuil IV word form encodes simultaneously:\n\n• Root — a conceptual domain (not a meaning)\n• Stem/Pattern — ontological sub-specification\n• Configuration — arrangement of instances\n• Affiliation — internal relational logic\n• Perspective — existential scope (M/P/N/A)\n• Extension — spatial/temporal bounding\n• Essence — actual vs. normative\n• Function — stative vs. dynamic\n• Specification — which conceptual facet\n• Case — semantic-syntactic role\n• Mood/Validation — epistemic stance\n• Bias — attitudinal stance\n\nNatural languages routinely under-specify all twelve. Ithkuil makes every decision explicit.`,
     key:"Ithkuil forces you to resolve distinctions that your native language lets you leave ambiguous. This is its difficulty and its power."},
    {id:3,label:"4. Neurological Model",color:"#7c3aed",
     title:"From Declarative to Procedural",
     body:`Ithkuil mastery requires a transition from declarative to procedural morphological knowledge.\n\nPhase 1 — Orientation: The dimensions of the system are not yet visible; the first task is simply to become aware of what needs to be encoded.\nPhase 2 — Pattern-building: The system's architecture is visible but not yet fluid; each encoding requires deliberate step-by-step effort.\nPhase 3 — Integration: Parameters are applied correctly with conscious effort; encoding becomes faster and more automatic.\nPhase 4 — Procedural fluency: Morphological construction becomes perceptual — forms are assembled before conscious thought. The learner no longer translates from English; they perceive conceptual structure directly.\n\nAt Phase 4, the learner does not translate from English. They perceive the conceptual structure of a situation directly and assemble its Ithkuil form as a single cognitive act. This is the MORPHOS training target.`,
     key:"The goal is not to know Ithkuil rules but to not need to think about them."},
    {id:4,label:"5. Dual Coding & Embodiment",color:"#1d4ed8",
     title:"Dual Coding and Semantic Embodiment",
     body:`MORPHOS exploits dual-coding theory systematically. Every morphological category is simultaneously:\n\n• Symbolically represented (formal notation: Ca complex, Stem 2)\n• Visually represented (color-coded slot in architecture diagram)\n• Auditorily represented (a specific frequency / chord)\n• Spatially grounded (a position in the conceptual space map)\n• Conceptually grounded (a concrete scenario that illustrates the distinction)\n\nThe synesthetic training system builds redundant neural encodings of every parameter. The goal is a learner whose Ithkuil intuition is not verbal/symbolic but spatially, auditorily, and experientially embodied — so that Configuration: Segmentative is not recalled from a list but felt as a perceptual gestalt.`,
     key:"The more sensory channels encode a morphological distinction, the more robust and automatic its recall becomes."},
  ];
  const s=stages[stage];
  return(
    <div>
      <div style={{marginBottom:14}}>
        <h2 style={{fontSize:16,color:'var(--bright)',marginBottom:4}}>Philosophical Framework</h2>
        <p style={{fontSize:11,color:'var(--muted)'}}>The cognitive philosophy underlying MORPHOS. Read this before beginning — it determines how you approach every exercise.</p>
      </div>
      <div style={{display:'flex',gap:4,marginBottom:14,flexWrap:'wrap'}}>
        {stages.map((st,i)=>(
          <button key={i} onClick={()=>setStage(i)} className="btn btn-sm"
            style={{background:stage===i?st.color+'33':'transparent',color:stage===i?st.color:'var(--muted)',
              border:`1px solid ${stage===i?st.color:'var(--border)'}`,fontSize:10}}>
            {st.label}
          </button>
        ))}
      </div>
      <div className="card fade-up" key={stage} style={{borderColor:s.color+'44',borderLeftWidth:3}}>

/* ══════════════════════════════════════════════════════════════════
   LAYER 11 — CDW (Concept Decomposition Workspace)
   ══════════════════════════════════════════════════════════════════ */
function CDW({params,setParams,synOn}){
  const[step,setStep]=useState(0);
  const[text,setText]=useState({situation:"",event:"",referent:""});
  const stepDefs=[
    {key:"situation",  label:"Situation",    sub:"Describe the idea or situation in your native language. Be as detailed as needed — you are thinking, not yet expressing.",       type:"textarea"},
    {key:"event",      label:"Core Event",   sub:"What is the fundamental event, state, or property at the center of this expression?",                                          type:"text"},
    {key:"referent",   label:"Referent",     sub:"What entity, process, or abstract property are you primarily encoding?",                                                        type:"text"},
    {key:"root",       label:"Root Domain",  sub:"Which conceptual domain does the referent belong to?",                                                                          type:"root"},
    {key:"configuration",label:"Configuration",sub:"How many instances? How are they arranged? (This is the most structurally important parameter — begin here.)",               type:"param"},
    {key:"affiliation",label:"Affiliation",  sub:"What is the internal relational logic among the members of this configuration?",                                                type:"param"},
    {key:"perspective",label:"Perspective",  sub:"Are you discussing a specific instance, a set, the type/category, or the pure abstract property?",                             type:"param"},
    {key:"extension",  label:"Extension",    sub:"Which portion of the referent are you discussing? Its full extent? Its beginning? Its near end?",                               type:"param"},
    {key:"essence",    label:"Essence",      sub:"Is this the actual thing as it concretely exists, or a normative/representative instance of the type?",                         type:"param"},
    {key:"specification",label:"Specification",sub:"Which of the four conceptual facets of the root is being foregrounded?",                                                      type:"param"},
    {key:"case",       label:"Case",         sub:"What semantic-syntactic role does this NP play? (Subject-like, object-like, tool, purpose, location...)",                       type:"case"},
    {key:"mood",       label:"Mood",         sub:"What is the speaker's epistemic/deontic relationship to this proposition?",                                                     type:"param"},
  ];
  const s=stepDefs[step];
  const renderField=()=>{
    if(s.type==="textarea") return<textarea rows={3} value={text[s.key]||""} onChange={e=>setText(p=>({...p,[s.key]:e.target.value}))} placeholder={s.sub}/>;
    if(s.type==="text") return<input type="text" value={text[s.key]||""} onChange={e=>setText(p=>({...p,[s.key]:e.target.value}))} placeholder={s.sub}/>;
    if(s.type==="root") return(
      <div>
        <select value={params.root||"KŢ"} onChange={e=>setParams(p=>({...p,root:e.target.value}))} style={{marginBottom:8}}>
          {Object.entries(DOMAIN_META).map(([d,meta])=>(
            <optgroup key={d} label={`Domain ${d}: ${meta.label}`}>
              {ROOTS.filter(r=>r.domain===d).map(r=><option key={r.id} value={r.id}>{r.id} — {r.desc.slice(0,50)}</option>)}
            </optgroup>
          ))}
        </select>
        {params.root&&<div style={{fontSize:11,color:'var(--muted)',lineHeight:1.6}}>
          <strong style={{color:ROOTS.find(r=>r.id===params.root)?.color}}>{ROOTS.find(r=>r.id===params.root)?.name}</strong>: {ROOTS.find(r=>r.id===params.root)?.desc}
        </div>}
      </div>
    );
    if(s.type==="param") return(
      <div>
        <ParamStrip paramKey={s.key} selectedId={params[s.key]} onChange={v=>{
          setParams(p=>({...p,[s.key]:v}));
          if(synOn&&TONE_MAP[v])playTone(TONE_MAP[v],0.2,'sine');
        }} synOn={synOn} showLabel={false}/>
        {params[s.key]&&<div style={{marginTop:8,padding:'7px 10px',borderRadius:6,background:PARAMS[s.key]?.hex+'15',border:`1px solid ${PARAMS[s.key]?.hex}33`,fontSize:11,color:PARAMS[s.key]?.hex}}>
          {PARAMS[s.key]?.values.find(v=>v.id===params[s.key])?.desc}
        </div>}
        {s.key==="configuration"&&params.configuration&&(
          <div style={{marginTop:8,display:'flex',gap:4,flexWrap:'wrap'}}>
            {PARAMS.configuration.values.slice(0,5).map(v=>(
              <div key={v.id} style={{opacity:params.configuration===v.id?1:0.3,transition:'opacity .2s',cursor:'pointer'}}
                onClick={()=>{setParams(p=>({...p,configuration:v.id}));if(synOn)playTone(v.freq,0.2,'sine');}}>
                <ConfigScenario configId={v.id} size={50}/>
                <div style={{fontSize:7,textAlign:'center',color:v.hue,marginTop:2}}>{v.label}</div>
              </div>
            ))}
          </div>
        )}
        {s.key==="extension"&&params.extension&&(
          <div style={{marginTop:8,display:'flex',gap:4,flexWrap:'wrap'}}>
            {PARAMS.extension.values.map(v=>(
              <div key={v.id} style={{opacity:params.extension===v.id?1:0.3,transition:'opacity .2s',cursor:'pointer'}}
                onClick={()=>{setParams(p=>({...p,extension:v.id}));if(synOn)playTone(v.freq,0.2,'sine');}}>
                <ExtensionScenario extId={v.id} size={60}/>
                <div style={{fontSize:7,textAlign:'center',color:v.hue,marginTop:2}}>{v.label}</div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
    if(s.type==="case") return(
      <div className="flex-col gap8">
        {["Transrelative","Appositive","Associative","Adverbial","Temporal","Spatio-temporal"].map(fam=>{
          const fc=CASES.find(c=>c.family===fam)?.color||'#4338ca';
          return(
            <div key={fam}>
              <div style={{fontSize:9,color:fc,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:4}}>{fam}</div>

                {CASES.filter(c=>c.family===fam).map(c=>(
                  <button key={c.id} className="btn btn-xs" onClick={()=>setParams(p=>({...p,case:c.id}))}
                    style={{background:params.case===c.id?c.color+'33':'var(--surface)',color:params.case===c.id?c.color:'var(--muted)',border:`1px solid ${params.case===c.id?c.color:'var(--border)'}`,fontSize:10}}
                    title={c.desc}>{c.label}</button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    );
  };
  return(
    <div className="flex-col gap10">
      <div style={{display:'flex',gap:2}}>
        {stepDefs.map((_,i)=><div key={i} style={{flex:1,height:3,borderRadius:2,cursor:'pointer',
          background:i<step?'var(--accent)':i===step?'#818cf8':'var(--border)',transition:'background .3s'}}
          onClick={()=>setStep(i)}/>)}
      </div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.1em'}}>Step {step+1} of {stepDefs.length}: {s.label}</span>
        <span style={{fontSize:9,color:'#3a3a5a'}}>{Math.round((step/stepDefs.length)*100)}% complete</span>
      </div>
      <div className="card fade-up" key={step}>
        <div style={{fontWeight:600,color:'var(--bright)',marginBottom:3,fontSize:13}}>{s.label}</div>
        <div style={{fontSize:11,color:'var(--muted)',marginBottom:10,lineHeight:1.6}}>{s.sub}</div>
        {renderField()}
      </div>
      {step>=3&&<MAV params={params} synOn={synOn}/>}
      <div style={{display:'flex',justifyContent:'space-between'}}>
        <button className="btn btn-ghost btn-sm" onClick={()=>setStep(Math.max(0,step-1))} disabled={step===0}>←</button>
        <button className="btn btn-primary btn-sm" onClick={()=>setStep(Math.min(stepDefs.length-1,step+1))} disabled={step===stepDefs.length-1}>→</button>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   LAYER 13 — SEMANTIC GRAPH (enhanced)
   ══════════════════════════════════════════════════════════════════ */
function SemanticGraph(){
  const[selected,setSelected]=useState(null);
  const[domainFilter,setDomainFilter]=useState(null);
  const[search,setSearch]=useState('');
  const[zoom,setZoom]=useState(1);
  const[pan,setPan]=useState({x:0,y:0});
  const[dragging,setDragging]=useState(false);
  const dragStart=useRef(null);
  const W=1800,H=1200;
  const domainColors={"I":"#b91c1c","II":"#c2410c","III":"#92400e","IV":"#4d7c0f","V":"#0f766e","VI":"#1d4ed8","VII":"#6d28d9","VIII":"#7c3aed","IX":"#0369a1"};
  const domainNames={"I":"Body","II":"Mind","III":"Language","IV":"Social","V":"Physical","VI":"Living","VII":"Artifact","VIII":"Value","IX":"Abstract"};
  const DOMAINS=["I","II","III","IV","V","VI","VII","VIII","IX"];

  const visibleRoots=useMemo(()=>{
    let rs=ROOTS.filter(r=>r.pos);
    if(domainFilter) rs=rs.filter(r=>r.domain===domainFilter);
    if(search.trim()) rs=rs.filter(r=>r.id.toLowerCase().includes(search.toLowerCase())||r.name.toLowerCase().includes(search.toLowerCase())||r.stem1.toLowerCase().includes(search.toLowerCase()));
    return rs;
  },[domainFilter,search]);

  const visibleIds=useMemo(()=>new Set(visibleRoots.map(r=>r.id)),[visibleRoots]);

  const edges=useMemo(()=>{
    const seen=new Set();
    const out=[];
    visibleRoots.forEach(root=>{
      (root.crosslinks||[]).forEach(cl=>{
        if(!visibleIds.has(cl)) return;
        const key=[root.id,cl].sort().join('|');
        if(seen.has(key)) return;
        seen.add(key);
        const pa=root.pos, pb=ROOTS.find(x=>x.id===cl)?.pos;
        if(pa&&pb) out.push({a:root.id,b:cl,pa,pb});
      });
    });
    return out;
  },[visibleRoots,visibleIds]);

  // Pan/zoom handlers
  const onMouseDown=useCallback(e=>{
    if(e.target.closest('g[data-root]')) return;
    setDragging(true);
    dragStart.current={x:e.clientX-pan.x,y:e.clientY-pan.y};
  },[pan]);
  const onMouseMove=useCallback(e=>{
    if(!dragging||!dragStart.current) return;
    setPan({x:e.clientX-dragStart.current.x,y:e.clientY-dragStart.current.y});
  },[dragging]);
  const onMouseUp=useCallback(()=>setDragging(false),[]);
  const onWheel=useCallback(e=>{
    setZoom(z=>Math.max(0.15,Math.min(3,z*(e.deltaY<0?1.1:0.91))));
  },[]);
  // Attach non-passive wheel listener so we can preventDefault (React onWheel is passive)
  const containerRef=useRef(null);
  useEffect(()=>{
    const el=containerRef.current;
    if(!el) return;
    const handler=(e)=>{ e.preventDefault(); setZoom(z=>Math.max(0.15,Math.min(3,z*(e.deltaY<0?1.1:0.91)))); };
    el.addEventListener('wheel',handler,{passive:false});
    return ()=>el.removeEventListener('wheel',handler);
  },[]);

  const r=selected?ROOTS.find(x=>x.id===selected):null;

  return <div style={{display:'flex',flexDirection:'column',gap:10,height:'100%'}}>
    {/* Controls */}
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
      <input type="text" placeholder="Search roots…" value={search} onChange={e=>setSearch(e.target.value)}
        style={{width:160,padding:'5px 10px',fontSize:12}}/>
      <button className="btn btn-sm btn-ghost" onClick={()=>{setZoom(1);setPan({x:0,y:0});}}>Reset view</button>
      <span style={{fontSize:11,color:'var(--muted)'}}>Scroll to zoom · drag to pan · click node</span>
      <div style={{marginLeft:'auto',display:'flex',gap:6,flexWrap:'wrap'}}>
        <button className="btn btn-xs btn-ghost" style={!domainFilter?{borderColor:'#4338ca',color:'var(--bright)'}:{}}
          onClick={()=>setDomainFilter(null)}>All</button>
        {DOMAINS.map(d=><button key={d} className="btn btn-xs btn-ghost"
          style={domainFilter===d?{borderColor:domainColors[d],color:domainColors[d]}:{color:domainColors[d]}}
          onClick={()=>setDomainFilter(domainFilter===d?null:d)}>{d}</button>)}
      </div>
    </div>
    {/* SVG canvas */}
    <div style={{flex:1,minHeight:480,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:8,overflow:'hidden',cursor:dragging?'grabbing':'grab',position:'relative'}}
      onMouseDown={onMouseDown} onMouseMove={onMouseMove} onMouseUp={onMouseUp} onMouseLeave={onMouseUp}
      ref={containerRef}>
      <svg width="100%" height="100%" viewBox={`0 0 900 600`} preserveAspectRatio="xMidYMid meet"
        style={{display:'block'}}>
        <g transform={`translate(${pan.x*0.5},${pan.y*0.5}) scale(${zoom})`}
           style={{transformOrigin:'450px 300px'}}>
          {/* Domain halos */}
          {!domainFilter&&DOMAINS.map(d=>{
            const dr=ROOTS.filter(r=>r.pos&&r.domain===d);
            if(!dr.length) return null;
            const xs=dr.map(r=>r.pos[0]*0.5),ys=dr.map(r=>r.pos[1]*0.5);
            const cx=xs.reduce((a,b)=>a+b,0)/xs.length;
            const cy=ys.reduce((a,b)=>a+b,0)/ys.length;
            const maxR=Math.max(...dr.map(r=>Math.hypot(r.pos[0]*0.5-cx,r.pos[1]*0.5-cy)))+18;
            return <g key={d}>
              <circle cx={cx} cy={cy} r={maxR} fill={domainColors[d]+'08'} stroke={domainColors[d]+'22'} strokeWidth={0.5}/>
              <text x={cx} y={cy-maxR-4} textAnchor="middle" fill={domainColors[d]} fontSize={7}
                fontFamily="IBM Plex Sans" fontWeight="700" opacity={0.7}>{d}: {domainNames[d]}</text>
            </g>;
          })}
          {/* Edges */}
          {edges.map(({a,b,pa,pb},i)=>{
            const isActive=selected&&(a===selected||b===selected);
            return <line key={i}
              x1={pa[0]*0.5} y1={pa[1]*0.5} x2={pb[0]*0.5} y2={pb[1]*0.5}
              stroke={isActive?'#6366f1':'#2a2a3a'}
              strokeWidth={isActive?1.2:0.5}
              opacity={isActive?0.9:(selected?0.15:0.45)}/>;
          })}
          {/* Nodes */}
          {visibleRoots.map(root=>{
            const [px,py]=[root.pos[0]*0.5,root.pos[1]*0.5];
            const color=domainColors[root.domain]||'#6d28d9';
            const isSel=selected===root.id;
            const isLinked=selected&&(r?.crosslinks||[]).includes(root.id);
            const dimmed=selected&&!isSel&&!isLinked;
            return <g key={root.id} data-root="1" style={{cursor:'pointer'}}
              onClick={()=>setSelected(isSel?null:root.id)}>
              <circle cx={px} cy={py} r={isSel?9:isLinked?7:5}
                fill={isSel?color:isLinked?color+'66':color+'22'}
                stroke={isSel?color:isLinked?color:'#3a3a4a'}
                strokeWidth={isSel?1.5:isLinked?1:0.6}
                opacity={dimmed?0.2:1}/>
              {(isSel||isLinked||!selected)&&<text x={px+7} y={py} dominantBaseline="middle"
                fill={isSel?color:isLinked?color:'#7070a0'}
                fontSize={isSel?8:6} fontFamily="IBM Plex Mono"
                fontWeight={isSel?'700':'400'}
                opacity={dimmed?0.2:1}>{root.id}</text>}
            </g>;
          })}
        </g>
      </svg>
      {/* Zoom indicator */}
      <div style={{position:'absolute',bottom:8,right:10,fontSize:10,color:'var(--muted)',pointerEvents:'none'}}>{Math.round(zoom*100)}%</div>
    </div>
    {/* Detail panel */}
    {r&&<div className="card fade-up" style={{borderColor:domainColors[r.domain]+'44',flexShrink:0}}>
      <div style={{display:'flex',gap:12,alignItems:'flex-start'}}>
        <span className="ithkuil" style={{fontSize:22,color:domainColors[r.domain],flexShrink:0}}>{r.id}</span>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontWeight:600,color:'var(--bright)',marginBottom:2}}>{r.name}
            <span style={{marginLeft:8,fontSize:11,color:domainColors[r.domain],fontWeight:400}}>Domain {r.domain}: {domainNames[r.domain]}</span>
          </div>
          <div style={{fontSize:12,color:'var(--muted)',marginBottom:8}}>{r.desc}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginBottom:8}}>
            {[1,2,3].map(s=><div key={s} style={{padding:'5px 8px',borderRadius:5,background:'var(--surface)',border:'1px solid var(--border)'}}>
              <div style={{fontSize:9,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:1}}>Stem {s}</div>
              <div style={{fontSize:11}}>{r['stem'+s]}</div>
            </div>)}
          </div>
          {r.crosslinks?.length>0&&<div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
            <span style={{fontSize:10,color:'var(--muted)'}}>Linked:</span>
            {r.crosslinks.map(cl=>{
              const cr=ROOTS.find(x=>x.id===cl);
              return <button key={cl} className="btn btn-xs btn-ghost"
                style={{color:domainColors[cr?.domain]||'var(--muted)',borderColor:domainColors[cr?.domain]+'44'||'var(--border)'}}
                onClick={()=>setSelected(cl)}>{cl} <span style={{opacity:0.6,fontSize:9}}>{cr?.name}</span></button>;
            })}
          </div>}
        </div>
      </div>
    </div>}
  </div>;
}
/* ══════════════════════════════════════════════════════════════════
   LAYER 14 — AI DIALOGUE MODE
   ══════════════════════════════════════════════════════════════════ */
function DialogueMode({apiKey}){
  const[msgs,setMsgs]=useState([{role:"assistant",content:"Welcome to Conceptual Dialogue Mode. Express any idea — however complex or abstract — and I will guide you through its Ithkuil IV encoding. I operate as a Socratic tutor: I will ask questions before giving answers. What would you like to encode?"}]);
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  const[mode,setMode]=useState("guided");
  const endRef=useRef(null);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:'smooth'}),[msgs]);
  const SYS=`You are an expert Ithkuil IV tutor in MORPHOS Conceptual Dialogue Mode. Mode: ${mode}.

When a learner presents an idea, guide them through encoding it in Ithkuil IV using the Socratic method.

Decompose ideas into these parameters (always use exact Ithkuil IV terminology):
Configuration (UNI/DPX/DCT/AGG/SEG/CPN/COH/CST/MUL)
Affiliation (CSL/ASO/VAR/COA)
Perspective (M=Monadic/P=Polyadic/N=Noumenal/A=Abstract)
Extension (DEL/PRX/DST/PXD/ICP/TRM)
Essence (NRM/RPV)
Specification (BSC/CTE/CSV/OBJ)
Function (STA/DYN)
Mood (FAC/SUB/ASM/SPE/CNT/IPT)
Validation (OBS/RCL/PUR/RPR/APR/IMG)
Bias (EUP/EUH/COR/DUB/TEN/NEG/SKP/CYN/CTM/EXA)
Case — all 28 cases by semantic family.

Mode behaviors:
- guided: Heavy scaffolding, hints after each turn, guide gently to correct answer
- collaborative: Co-construct parameter choices together, share reasoning openly
- challenge: Only confirm/deny, learner must reason independently
- critique: Accept a full Ithkuil specification from learner, then deliver detailed expert critique

Always end your response by asking a specific probing question about one parameter. When you produce an Ithkuil form, use \`backticks\`.`;
  const send=async()=>{
    if(!input.trim()||loading) return;
    const um={role:"user",content:input};
    const nm=[...msgs,um];
    setMsgs(nm);setInput("");setLoading(true);
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":apiKey||"","anthropic-version":"2023-06-01"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:SYS,
          messages:nm.map(m=>({role:m.role,content:m.content}))})});
      const d=await r.json();
      setMsgs([...nm,{role:"assistant",content:d.content?.[0]?.text||"API error"}]);
    }catch(e){
      setMsgs([...nm,{role:"assistant",content:"Connection error. Check API key in Settings."}]);
    }
    setLoading(false);
  };
  const renderContent=text=>{
    const parts=text.split(/`([^`]+)`/);
    return parts.map((p2,i)=>i%2===1?<code key={i} style={{background:'#1e1b4b',color:'#a5b4fc',padding:'1px 6px',borderRadius:3,fontFamily:'IBM Plex Mono',fontWeight:600,fontSize:13}}>{p2}</code>:p2);
  };
  const modes=[{id:"guided",label:"Guided"},{id:"collaborative",label:"Collaborative"},{id:"challenge",label:"Challenge"},{id:"critique",label:"Critique"}];
  return(
    <div className="flex-col" style={{height:'100%',gap:10,minHeight:0}}>
      <div style={{display:'flex',gap:4}}>
        {modes.map(m=><button key={m.id} className="btn btn-xs" onClick={()=>setMode(m.id)}
          style={{background:mode===m.id?'var(--accent)33':'transparent',color:mode===m.id?'var(--accent2)':'var(--muted)',border:`1px solid ${mode===m.id?'var(--accent)':'var(--border)'}`}}>{m.label}</button>)}
      </div>
      <div className="sy" style={{flex:1,minHeight:280,maxHeight:380,display:'flex',flexDirection:'column',gap:8,overflowY:'auto',padding:4}}>
        {msgs.map((m,i)=>(
          <div key={i} style={{display:'flex',justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
            <div style={{maxWidth:'88%',padding:'9px 13px',borderRadius:8,lineHeight:1.7,fontSize:12,whiteSpace:'pre-wrap',wordBreak:'break-word',
              background:m.role==="user"?'rgba(80,70,229,.25)':'var(--card)',border:`1px solid ${m.role==="user"?'#5046e544':'var(--border)'}`}}>
              {renderContent(m.content)}
            </div>
          </div>
        ))}
        {loading&&<div style={{display:'flex',gap:5,padding:'9px 13px'}}>
          {[0,1,2].map(i=><div key={i} style={{width:5,height:5,borderRadius:'50%',background:'var(--muted)',animation:`pulse 1.2s ${i*0.2}s infinite`}}/>)}
        </div>}
        <div ref={endRef}/>
      </div>
      <div style={{display:'flex',gap:6}}>
        <input type="text" value={input} onChange={e=>setInput(e.target.value)} onKeyDown={e=>e.key==="Enter"&&send()}
          placeholder="Express any idea for Ithkuil encoding..." style={{flex:1,fontSize:12}}/>
        <button className="btn btn-primary" onClick={send} disabled={loading||!input.trim()}>→</button>
      </div>
      {!apiKey&&<div style={{fontSize:10,color:'#b45309',background:'#451a0322',border:'1px solid #78350f44',borderRadius:5,padding:'5px 8px'}}>
        Set Anthropic API key in Settings to enable AI dialogue.
      </div>}
    </div>
  );
}

function Sandbox({synOn}){
  const[params,setParams]=useState(defaultP());
  const[saved,setSaved]=useState([]);
  const[notes,setNotes]=useState("");
  const[compare,setCompare]=useState(null);
  const[showAnatomy,setShowAnatomy]=useState(false);
  const ik=useIthkuil();
  const form=buildFormLive(params);
  const gloss=useMemo(()=>ik.loaded?glossForm(params):null,[params,ik.loaded]);
  return(
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:14,minHeight:0}}>
      <div className="flex-col gap10 sy" style={{overflowY:'auto',maxHeight:'calc(100vh - 140px)',background:'var(--surface)',borderRadius:8,padding:12,border:'1px solid var(--border)'}}>
        <div style={{fontSize:10,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.1em'}}>Parameter Assembly</div>
        <PSP params={params} onChange={setParams} synOn={synOn}/>
        <input type="text" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="What does this form express?"/>
        <button className="btn btn-primary" onClick={()=>{setSaved(p=>[...p,{params:{...params},form,notes,id:Date.now()}]);setNotes("");}}>Save to Lexicon</button>
      </div>
      <div className="flex-col gap10">
        <MAV params={params} synOn={synOn}/>
        <div className="card">
          <div style={{fontSize:9,color:'var(--muted)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.08em'}}>Assembled Form</div>
          <div style={{display:'flex',gap:10,alignItems:'center',justifyContent:'space-between'}}>
            <span className="ithkuil" style={{fontSize:28,color:'var(--bright)',letterSpacing:'.12em'}}>{form}</span>
            <button className="btn btn-ghost btn-xs" onClick={()=>setShowAnatomy(v=>!v)}>
              {showAnatomy?"Hide":"Anatomy"}
            </button>
          </div>
          {gloss&&<div style={{marginTop:5,fontSize:11,fontFamily:'IBM Plex Mono',color:'var(--muted)',lineHeight:1.5,borderTop:'1px solid var(--border)',paddingTop:5}}>
            <span style={{color:'var(--accent2)',fontSize:9,textTransform:'uppercase',letterSpacing:'.08em',marginRight:6}}>gloss</span>
            {gloss.gloss}
          </div>}
          {!ik.loaded&&<div style={{marginTop:4,fontSize:10,color:'var(--muted)',fontStyle:'italic'}}>gloss available when live engine loads</div>}
          {showAnatomy&&(
            <div className="fade-up" style={{marginTop:8,fontSize:10,lineHeight:1.8}}>
              {[{l:"Root",v:`${params.root} — ${ROOTS.find(r=>r.id===params.root)?.name}`},{l:"Stem/Pat",v:`${params.stem} · ${params.pattern}`},{l:"Configuration",v:`${params.configuration}: ${PARAMS.configuration.values.find(v=>v.id===params.configuration)?.desc}`},{l:"Affiliation",v:`${params.affiliation}: ${PARAMS.affiliation.values.find(v=>v.id===params.affiliation)?.desc}`},{l:"Perspective",v:`${params.perspective}: ${PARAMS.perspective.values.find(v=>v.id===params.perspective)?.desc}`},{l:"Extension",v:`${params.extension}: ${PARAMS.extension.values.find(v=>v.id===params.extension)?.desc}`},{l:"Case",v:`${CASES.find(c=>c.id===params.case)?.label}: ${CASES.find(c=>c.id===params.case)?.desc}`}].map(item=>(
                <div key={item.l} style={{display:'flex',gap:6}}>
                  <span style={{color:'var(--muted)',minWidth:80,flexShrink:0}}>{item.l}:</span>
                  <span style={{color:'var(--text)'}}>{item.v}</span>
                </div>
              ))}
            </div>
          )}
        </div>
        {compare&&(
          <div className="card" style={{borderColor:'#0f766e44'}}>
            <div style={{fontSize:9,color:'#0f766e',fontWeight:700,textTransform:'uppercase',marginBottom:4}}>Comparing</div>
            <span className="ithkuil" style={{fontSize:20,color:'#0f766e'}}>{compare.form}</span>
            <p style={{fontSize:10,color:'var(--muted)',marginTop:4}}>{compare.notes||'—'}</p>
            <button className="btn btn-ghost btn-xs" style={{marginTop:4}} onClick={()=>setCompare(null)}>Clear</button>
          </div>
        )}
        {saved.length>0&&(
          <div>
            <div style={{fontSize:9,color:'var(--muted)',marginBottom:5,textTransform:'uppercase',letterSpacing:'.08em'}}>Lexicon ({saved.length})</div>
            <div className="flex-col gap3 sy" style={{maxHeight:180,overflowY:'auto'}}>
              {saved.map(s=>(
                <div key={s.id} style={{display:'flex',gap:6,alignItems:'center',padding:'5px 8px',borderRadius:5,background:'var(--surface)',border:'1px solid var(--border)'}}>
                  <span className="ithkuil" style={{fontSize:12,color:'var(--bright)',minWidth:60}}>{s.form}</span>
                  <span style={{fontSize:10,color:'var(--muted)',flex:1}}>{s.notes||'—'}</span>
                  <button className="btn btn-xs btn-ghost" onClick={()=>setParams({...s.params})} title="Load">↑</button>
                  <button className="btn btn-xs btn-ghost" onClick={()=>setCompare(s)} title="Compare">⇄</button>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

              {paramNames.map(pName=>{
                const vals=lm[pName]||{};
                const weakest=Object.entries(vals).sort((a,b)=>a[1]-b[1]).slice(0,2);
                return weakest.map(([vId,score])=>score<0.5?<div key={vId} style={{display:'flex',justifyContent:'space-between',fontSize:11}}>
                  <span style={{color:'var(--text)'}}>{PARAMS[pName]?.values.find(v=>v.id===vId)?.label}</span>
                  <span style={{color:'#f59e0b'}}>{Math.round(score*100)}%</span>
                </div>:null);
              })}
            </div>
          </div>
          {/* FSRS stats card */}
          {(()=>{
            const now=Date.now();
            const allCards=Object.entries(lm.srs||{});
            const reviewed=allCards.filter(([,c])=>c.reps>0);
            const dueNow=allCards.filter(([,c])=>c.due<=now&&(c.state||0)>=1);
            // Estimated retention: R(elapsed, S) averaged over all review-state cards
            const retCards=allCards.filter(([,c])=>(c.state||0)===2&&c.s>0&&c.lastReview>0);
            const avgRet=retCards.length?retCards.reduce((sum,[,c])=>{
              const t=(now-c.lastReview)/864e5;
              return sum+fsrsR(t,c.s);
            },0)/retCards.length:null;
            // Due forecast: next 14 days
            const forecast=Array.from({length:14},(_,i)=>{
              const dayStart=now+i*864e5, dayEnd=dayStart+864e5;
              return allCards.filter(([,c])=>c.due>=dayStart&&c.due<dayEnd&&(c.state||0)>=1).length;
            });
            const maxForecast=Math.max(...forecast,1);
            // Avg response time
            const timed=allCards.filter(([,c])=>c.avgMs>0);
            const avgMs=timed.length?timed.reduce((s,[,c])=>s+c.avgMs,0)/timed.length:null;
            return(
              <div className="card">
                <div style={{fontSize:12,fontWeight:600,color:'var(--bright)',marginBottom:10}}>FSRS Memory State</div>
                <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:12}}>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:20,fontWeight:700,color:'#ef4444',fontFamily:'Cinzel,serif'}}>{dueNow.length}</div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>Due now</div>
                  </div>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:20,fontWeight:700,color:'#60a5fa',fontFamily:'Cinzel,serif'}}>{reviewed.length}</div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>Concepts seen</div>
                  </div>
                  <div style={{textAlign:'center'}}>
                    <div style={{fontSize:20,fontWeight:700,color:'#22c55e',fontFamily:'Cinzel,serif'}}>
                      {avgRet!=null?Math.round(avgRet*100)+'%':'—'}
                    </div>
                    <div style={{fontSize:10,color:'var(--muted)'}}>Est. retention</div>
                  </div>
                </div>
                {/* 14-day due forecast bar chart */}
                <div style={{fontSize:10,color:'var(--muted)',marginBottom:5}}>14-day due forecast</div>
                <div style={{display:'flex',gap:2,alignItems:'flex-end',height:36}}>
                  {forecast.map((n,i)=>{
                    const isToday=i===0;
                    const h=Math.max(2,Math.round((n/maxForecast)*34));
                    return(
                      <div key={i} title={`Day +${i}: ${n} due`} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:1}}>
                        <div style={{width:'100%',height:h,borderRadius:2,
                          background:isToday?'#ef4444':n>0?'#4338ca':'var(--border)',transition:'height .3s'}}/>
                        {(i===0||i===6||i===13)&&<span style={{fontSize:8,color:'var(--muted)'}}>{i===0?'T':'+'+i}</span>}
                      </div>
                    );
                  })}
                </div>
                {avgMs!=null&&<div style={{marginTop:8,fontSize:10,color:'var(--muted)'}}>
                  Avg response: {(avgMs/1000).toFixed(1)}s · {timed.length} timed reviews
                </div>}
                <button className="btn btn-primary btn-sm" style={{marginTop:10,width:'100%'}} onClick={()=>onNav&&onNav('puzzles')}>Go to Puzzle Hall →</button>
              </div>
            );
          })()}
        </div>
      </div>
    </div>
  );
}
