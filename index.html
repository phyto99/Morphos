/* Phonotactics checker — returns null if uncertain, true/false if determinable */
function checkCluster(seq){
  const VALID=['pr','pl','br','bl','tr','dr','kr','kl','gr','gl','fr','fl','str','spr','skr',
    'štr','špr','ţr','çr','xl','xr','st','sk','sp','zb','zd','zg','šk','šp','št','çk','çt'];
  const INVALID=['nl','mr','rl','lr','nm','mn','gg','pp','bb','dd','tt','kk','nb','ng','nd'];
  const s=seq.toLowerCase().replace(/\s/g,'');
  if(INVALID.some(c=>s.includes(c)))return false;
  if(VALID.some(c=>s===c||s.startsWith(c))&&s.length<=3)return true;
  return null;
}

/* ── ESPEAK-NG IPA SYNTHESIS ─────────────────────────────────────────────── */

// Convert IPA string → eSpeak CXS phoneme notation for [[...]] inline input.
// Multi-char sequences handled before single chars to avoid partial substitution.
function ipaToEspeak(ipa) {
  let s = ipa.trim();
  // Affricates (before component stops)
  s = s.replace(/tʃ/g,'tS');   s = s.replace(/dʒ/g,'dZ');
  s = s.replace(/ts/g,'ts');   s = s.replace(/dz/g,'dz');
  // Voiceless trill (r + U+0325 combining ring below) → trill approx
  s = s.replace(/r\u0325/g,'r');
  // Long vowels before length mark stripping
  s = s.replace(/aː/g,'a:');   s = s.replace(/eː/g,'e:');
  s = s.replace(/iː/g,'i:');   s = s.replace(/oː/g,'o:');   s = s.replace(/uː/g,'u:');
  s = s.replace(/ː/g,':');
  // Suprasegmentals
  s = s.replace(/ˈ/g,"'");     s = s.replace(/ˌ/g,',');
  // Vowels that need mapping (a e i o u pass through as-is)
  s = s.replace(/ɛ/g,'E');     // open-mid front (Ithkuil 'e')
  s = s.replace(/ø/g,'2');     // close-mid front rounded (Ithkuil 'ö')
  s = s.replace(/y/g,'y');     // high front rounded (Ithkuil 'ü')
  // Consonants — full Ithkuil inventory
  s = s.replace(/θ/g,'T');     // voiceless dental fricative (ţ)
  s = s.replace(/ð/g,'D');     // voiced dental fricative (ḑ)
  s = s.replace(/ʃ/g,'S');     // voiceless postalveolar (š)
  s = s.replace(/ʒ/g,'Z');     // voiced postalveolar (ž)
  s = s.replace(/ç/g,'C');     // voiceless palatal fricative (ç)
  s = s.replace(/ħ/g,'H');     // voiceless pharyngeal fricative (ħ)
  s = s.replace(/ŋ/g,'N');     // velar nasal (ň)
  s = s.replace(/ɬ/g,'l#');    // voiceless lateral fricative (ļ)
  s = s.replace(/ʔ/g,'?');     // glottal stop (ʼ)
  // p b t d k g q f v s z x h r l m n w j pass through unchanged
  return s;
}

// Ithkuil romanization → IPA (built lazily from PHONO_CONSONANTS/PHONO_VOWELS)
let _romKeys=null, _romMap=null;
function romanToIPA(text) {
  if (!_romKeys) {
    _romMap={};
    [...PHONO_CONSONANTS,...PHONO_VOWELS].forEach(x=>{ _romMap[x.r]=x.ipa; });
    _romKeys=Object.keys(_romMap).sort((a,b)=>b.length-a.length);
  }
  let out='', i=0;
  while(i<text.length){
    const match=_romKeys.find(k=>text.startsWith(k,i));
    if(match){out+=_romMap[match];i+=match.length;}
    else{out+=text[i++];}
  }
  return out;
}

// eSpeak-NG engine (single instance, async init)
let _espeakEngine=null, _espeakReady=false, _espeakQueue=[];
(async function _initEspeak(){
  const L=(msg,...a)=>console.log('[eSpeak]',msg,...a);
  const E=(msg,...a)=>console.error('[eSpeak]',msg,...a);
  L('starting init');
  if(typeof eSpeakNG==='undefined'){E('eSpeakNG class not found — CDN script did not load');return;}
  L('eSpeakNG class present');
  try{
    const CDN='https://cdn.jsdelivr.net/gh/steveseguin/espeakng.js@master/js/';
    L('fetching worker + data from CDN...');
    let workerSrc, dataBuf;
    try{
      workerSrc=await fetch(CDN+'espeakng.worker.js').then(r=>{
        L('worker.js response status:',r.status);
        if(!r.ok)throw new Error('worker.js HTTP '+r.status);
        return r.text();
      });
      L('worker.js fetched, length:',workerSrc.length);
      // Patch espeakPHONEMES flag: change hardcoded flags=0 → flags=256 in both branches of espeak_Synth call
      const patched=workerSrc.replaceAll(',0,0,1,0,0,0,0)',',0,0,1,0,256,0,0)');
      const patchCount=(workerSrc.match(/,0,0,1,0,0,0,0\)/g)||[]).length;
      L('espeakPHONEMES patch applied to',patchCount,'call sites');
      workerSrc=patched;
    }catch(e){E('fetch worker.js failed:',e);throw e;}
    try{
      dataBuf=await fetch(CDN+'espeakng.worker.data').then(r=>{
        L('worker.data response status:',r.status);
        if(!r.ok)throw new Error('worker.data HTTP '+r.status);
        return r.arrayBuffer();
      });
      L('worker.data fetched, bytes:',dataBuf.byteLength);
    }catch(e){E('fetch worker.data failed:',e);throw e;}
    L('base64-encoding data...');
    const u8=new Uint8Array(dataBuf);
    let bin='';
    for(let i=0;i<u8.length;i+=0x8000) bin+=String.fromCharCode(...u8.subarray(i,i+0x8000));
    const b64=btoa(bin);
    L('base64 length:',b64.length);
    const prefix=
      `var _ED=(function(){const s=atob('${b64}');`+
      `const a=new ArrayBuffer(s.length);const v=new Uint8Array(a);`+
      `for(let i=0;i<s.length;i++)v[i]=s.charCodeAt(i);return a;})();\n`+
      'self.postMessage({_espeakDataReady:true});\n'+
      '(function(){const _X=XMLHttpRequest;'+
      'XMLHttpRequest=function(){'+
      '  const x=new _X(),_oo=x.open.bind(x),_os=x.send.bind(x);let _d=false;'+
      '  x.open=function(m,u){'+
      '    if(typeof u===\'string\'&&/\\.data$/.test(u)){_d=true;return;}'+
      '    return _oo.apply(x,arguments);'+
      '  };'+
      '  x.send=function(){'+
      '    if(_d){'+
      '      setTimeout(function(){'+
      '        Object.defineProperty(x,\'readyState\',{get:function(){return 4;},configurable:true});'+
      '        Object.defineProperty(x,\'status\',{get:function(){return 200;},configurable:true});'+
      '        Object.defineProperty(x,\'response\',{get:function(){return _ED;},configurable:true});'+
      '        if(x.onreadystatechange)x.onreadystatechange();'+
      '        if(x.onload)x.onload();'+
      '      },0);return;'+
      '    }'+
      '    return _os.apply(x,arguments);'+
      '  };'+
      '  return x;'+
      '};'+
      'XMLHttpRequest.DONE=4;XMLHttpRequest.OPENED=1;'+
      'XMLHttpRequest.HEADERS_RECEIVED=2;XMLHttpRequest.LOADING=3;XMLHttpRequest.UNSENT=0;'+
      '})();\n';
    L('building worker blob...');
    const wURL=URL.createObjectURL(new Blob([prefix+workerSrc],{type:'application/javascript'}));
    L('worker blob URL created, launching eSpeakNG...');
    _espeakEngine=new eSpeakNG(wURL,(engine)=>{
      L('ready callback fired, setting voice...');
      _espeakEngine.set_voice('en');
      L('voice set to en — engine ready');
      _espeakReady=true;
      URL.revokeObjectURL(wURL);
      _espeakQueue.forEach(fn=>fn());
      _espeakQueue=[];
    });
    // Log any messages coming back from the worker for diagnosis
    if(_espeakEngine._worker){
      const orig=_espeakEngine._worker.onmessage;
      _espeakEngine._worker.addEventListener('message',e=>{
        if(e.data&&e.data._espeakDataReady) L('worker: data decoded OK');
      });
      _espeakEngine._worker.addEventListener('error',e=>{
        E('worker error:',e.message,e.filename,e.lineno);
      });
    }
    L('eSpeakNG constructor returned, waiting for ready...');
  }catch(e){E('init failed:',e);}
})();

function _doSpeakIPA(ipa){
  if(!_espeakEngine) return;
  const chunks=[];
  const ph=ipaToEspeak(ipa.trim());
  _espeakEngine.synthesize(`[[${ph}]]`,(samples)=>{
    if(samples===undefined){
      // End-of-synthesis signal — concatenate all chunks and play once
      const total=chunks.reduce((s,c)=>s+c.length,0);
      if(!total) return;
      const ctx=getAudioCtx();
      ctx.resume().then(()=>{
        const buf=ctx.createBuffer(1,total,22050);
        const ch=buf.getChannelData(0);
        let off=0;
        for(const c of chunks){ch.set(c,off);off+=c.length;}
        const src=ctx.createBufferSource();
        src.buffer=buf; src.connect(ctx.destination); src.start();
      });
      return;
    }
    const buf=samples instanceof ArrayBuffer?samples:samples.buffer;
    if(!buf||!buf.byteLength) return;
    // eSpeak worker delivers Float32 stereo-interleaved [L0,R0,L1,R1,...] at 22050 Hz
    // L == R (mono source duplicated), so just take left channel
    const f32=new Float32Array(buf);
    const frames=Math.floor(f32.length/2);
    if(!frames) return;
    const mono=new Float32Array(frames);
    for(let i=0;i<frames;i++) mono[i]=f32[i*2];
    chunks.push(mono);
  });
}

// Speak an IPA string (queues if engine not yet ready)
function speakIPA(ipa){
  if(!ipa) return;
  if(_espeakReady) _doSpeakIPA(ipa);
  else _espeakQueue.push(()=>_doSpeakIPA(ipa));
}

// Speak an Ithkuil word in romanized form
function speakIthkuil(roman){ speakIPA(romanToIPA(roman)); }

/* ══════════════════════════════════════════════════════════════════
   LAYER 17C — LIVE ROOT HYDRATION
   When window.IK loads, enrich ROOTS with real stem descriptions.
   Lookup is by romanized consonant root (Cr field).
   ══════════════════════════════════════════════════════════════════ */
function useRootHydration(){
  const[hydrated,setHydrated]=useState(false);
  useEffect(()=>{
    const hydrate=()=>{
      if(!window.IK?.rootIndex||hydrated)return;
      let enriched=0;
      ROOTS.forEach(r=>{
        const cr=(IK_ROOT[r.id]||r.id).toLowerCase();
        const live=window.IK.rootIndex[cr];
        if(live){
          // Merge live stem descriptions if available
          if(live.stems&&live.stems[0]&&!r._hydrated){
            r.stem1=live.stems[0]?.BSC||live.stems[0]||r.stem1;
            r.stem2=live.stems[1]?.BSC||live.stems[1]||r.stem2;
            r.stem3=live.stems[2]?.BSC||live.stems[2]||r.stem3;
            r.desc=live.refers||live.description||r.desc;
            r._hydrated=true;
            enriched++;
          }
        }
      });
      if(enriched>0){
        setHydrated(true);
        console.info(`[MORPHOS] Hydrated ${enriched} roots from live zsnout data`);
      }
    };
    if(window.IK?.loaded) hydrate();
    const h=()=>hydrate();
    window.addEventListener('ithkuil-loaded',h);
    return()=>window.removeEventListener('ithkuil-loaded',h);
  },[hydrated]);
  return hydrated;
}

// Exact dark values for each endpoint — tint lerps between these
const DARK={
  lichess:{'--bg':'#0c0b0a','--surface':'#1b1917','--card':'#131211','--border':'#282522',
           '--text':'#d8d4cf','--muted':'#6e6a66','--bright':'#f0ece8'},
  discord:{'--bg':'#09090c','--surface':'#15161a','--card':'#0f1014','--border':'#222430',
           '--text':'#d4d6df','--muted':'#606370','--bright':'#eceef5'},
};
const LIGHT_TEXT={
  lichess:{'--text':'#201e1c','--muted':'#6e6a66','--bright':'#100e0c'},
  discord:{'--text':'#1a1b1e','--muted':'#60656e','--bright':'#060607'},
};

// brightness: 0-100 continuous — named stops: 0=amoled(black) 33=dark 66=ash 100=light
// tint: 0=lichess 100=discord
function computeVars(tint,brightness){
  const f=tint/100;
  const h2=(hex,i)=>parseInt(hex.slice(i,i+2),16);
  const lerpH=(a,b,t=f)=>{
    const r=Math.round(h2(a,1)*(1-t)+h2(b,1)*t);
    const g=Math.round(h2(a,3)*(1-t)+h2(b,3)*t);
    const bv=Math.round(h2(a,5)*(1-t)+h2(b,5)*t);
    return '#'+[r,g,bv].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
  };
  const offsetH=(hex,off)=>{
    return '#'+[1,3,5].map(i=>Math.max(0,Math.min(255,h2(hex,i)+off)).toString(16).padStart(2,'0')).join('');
  };
  // Segment the 0-100 range into three zones:
  //   0=amoled(pure black) → 33=dark anchor → 66=ash → 100=light
  // For the amoled→dark segment we lerp each channel directly to black,
  // so the transition is perfectly proportional and never jumps.
  const t01=brightness<=33?brightness/33:1; // 0..1 within amoled→dark
  const isLight=brightness>=80;
  const vars={'--accent':'#3730a3','--accent2':'#4338ca'};
  for(const k of['--bg','--surface','--card','--border']){
    const darkBase=lerpH(DARK.lichess[k],DARK.discord[k]);
    let color;
    if(brightness<=33){
      // bg/surface/card lerp to pure black; border keeps a faint floor so separators stay visible
      const amoledFloor=k==='--border'?'#1a1a1a':'#000000';
      color=lerpH(amoledFloor,darkBase,t01);
    } else if(brightness<=66){
      const t=( brightness-33)/33;
      color=offsetH(darkBase,Math.round(18*t));
    } else {
      color=offsetH(darkBase,Math.round(18+202*(brightness-66)/34));
    }
    // border: never go below dark-8 in the ash→light range
    if(k==='--border'&&brightness>33){
      const darkBorder=lerpH(DARK.lichess[k],DARK.discord[k]);
      const minOff=-20;
      const rawOff=brightness<=66?Math.round(18*(brightness-33)/33):Math.round(18+202*(brightness-66)/34);
      color=offsetH(darkBorder,Math.max(rawOff,minOff));
    }
    vars[k]=color;
  }
  const txtSrc=isLight?LIGHT_TEXT:DARK;
  for(const k of['--text','--muted','--bright'])
    vars[k]=lerpH(txtSrc.lichess[k],txtSrc.discord[k]);
  return vars;
}

        streak:correct?prev.streak+1:0,

    });
  },[]);

    {id:"nav-learn",label:"Learn",items:[
      {id:"framework",icon:"⊙",label:"Philosophy"},
      {id:"dashboard",icon:"◈",label:"Dashboard"},

    {id:"nav-train",label:"Train",items:[

      {id:"synesthetic",icon:"◉",label:"Synesthetic"},
      {id:"cdw",icon:"◆",label:"Decompose"},
      {id:"wde",icon:"⊘",label:"Deconstruct"},
    ]},
    {id:"nav-ref",label:"Reference",items:[
      {id:"sandbox",icon:"□",label:"Sandbox"},
      {id:"phonology",icon:"♪",label:"Phonology"},
      {id:"graph",icon:"∿",label:"Root Graph"},
      {id:"cases",icon:"▷",label:"Cases"},
    ]},
    {id:"nav-adv",label:"Advanced",items:[
      {id:"dialogue",icon:"~",label:"AI Dialogue"},
      {id:"future",icon:"⊙",label:"Future"},
      {id:"settings",icon:"⚙",label:"Settings"},
    ]},

    if(view==="phonology")  return <Phonology/>;

      setLm(prev=>{
        let n={...prev,
          totalAttempts:prev.totalAttempts+1,
          totalCorrect:prev.totalCorrect+(correct?1:0),
          xp:prev.xp+(correct?15:2),
          streak:correct?prev.streak+1:0,
        };
        paramKeys.forEach(pk=>{
          if(!PARAMS[pk])return;
          const vals=n[pk]||{};
          // Nudge mastery scores
          const updated={};
          Object.entries(vals).forEach(([vid,score])=>{
            updated[vid]=Math.min(1,Math.max(0,score+(correct?0.04:-0.01)));
          });
          n={...n,[pk]:updated};
          // FSRS: update every value for this param with response time
          Object.keys(vals).forEach(vid=>{ n=fsrsRate(n,pk,vid,correct,ms||5000); });
          // Module progress
          const mod=PUZZLE_REGISTRY[Object.entries(PARAM_DRILLS).find(([,ids])=>ids.includes(pk))?.[0]||'']?.module;
          if(mod){
            const p2=n.moduleProgress[mod]||0;
            n={...n,moduleProgress:{...n.moduleProgress,[mod]:Math.min(1,p2+(correct?0.015:0))}};
          }
        });
        return n;
      });
    }}/>;
    if(view==="synesthetic")return <SynestheticTrainer synOn={synOn} setSynOn={setSynOn}/>;
    if(view==="cdw")        return <CDW params={sandboxParams} setParams={setSP} synOn={synOn}/>;

  return(
    <>
    <YuorbModal/>
    <div style={{display:'flex',minHeight:'100vh'}}>
      {/* SIDEBAR — v1 style */}

        <div style={{padding:'20px 14px 16px',borderBottom:'1px solid var(--border)'}}>

                <button key={item.id} onClick={()=>setView(item.id)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:6,border:'none',cursor:'pointer',textAlign:'left',fontFamily:'IBM Plex Sans,sans-serif',fontSize:12,fontWeight:view===item.id?600:400,background:view===item.id?'rgba(67,56,202,0.25)':'transparent',color:view===item.id?'var(--bright)':'var(--muted)',transition:'all 0.12s',width:'100%'}}>
                  <span style={{fontSize:11,opacity:0.8}}>{item.icon}</span>{item.label}
                </button>
              ))}
            </div>
          ))}
        </nav>
        <div style={{padding:'10px 14px',borderTop:'1px solid var(--border)'}}>

          <ProgressMeter value={Math.min(1,(lm.xp%200)/200)} color="#f59e0b"/>
          <div style={{marginTop:4,fontSize:10,color:'var(--muted)'}}>Level {calcStage(lm)}/4 · {lm.streak}🔥 streak</div>
        </div>
      </div>
      {/* MAIN */}
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        <header style={{padding:'12px 24px',borderBottom:'1px solid var(--border)',background:'var(--surface)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div>
            <h2 style={{fontSize:15,color:'var(--bright)',fontFamily:'Cinzel,serif',letterSpacing:'0.06em'}}>{viewTitles[view]}</h2>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <InfoPill label="Streak" value={`${lm.streak}🔥`}/>

            {(()=>{const nr=nextRecommendedPuzzle(lm);return nr?<button className="btn btn-ghost btn-sm" onClick={()=>{setView('puzzles');setTimeout(()=>window.dispatchEvent(new CustomEvent('launch-drill',{detail:{id:nr.id,def:nr.def}})),150);}} title={nr.reason} style={{fontSize:10,color:'var(--accent2)',borderColor:'var(--accent)44'}}>▶ Next</button>:null;})()}
            <div title={ik&&ik.loaded?'Live @zsnout/ithkuil':'Placeholder morphology'} style={{
              fontSize:9,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',

              background:ik&&ik.loaded?'rgba(34,197,94,.15)':'rgba(110,112,153,.1)',
              color:ik&&ik.loaded?'#22c55e':'var(--muted)',
              border:'1px solid '+(ik&&ik.loaded?'#22c55e44':'var(--border)')}}>
              {ik&&ik.loaded?'● live':'○ local'}

<script type="module">
/* LAYER 20 — ZSNOUT LIVE ENGINE */
async function loadIK(){
  try{
    const[gen,parse,data,gloss]=await Promise.all([
      import('https://esm.sh/@zsnout/ithkuil/generate'),
      import('https://esm.sh/@zsnout/ithkuil/parse'),
      import('https://esm.sh/@zsnout/ithkuil/data'),
      import('https://esm.sh/@zsnout/ithkuil/gloss'),
    ]);
    window.IK={gen,parse,data,gloss,loaded:true,version:'live'};
    if(data&&data.roots){
      window.IK.rootIndex={};
      const src=Array.isArray(data.roots)?data.roots:Object.entries(data.roots);
      src.forEach(entry=>{
        const cr=Array.isArray(entry)?entry[0]:entry.cr;
        const info=Array.isArray(entry)?entry[1]:entry;
        if(cr)window.IK.rootIndex[cr.toLowerCase()]=info;
      });
    }
    window.dispatchEvent(new CustomEvent('ithkuil-loaded',{detail:{version:'live'}}));
    console.info('[MORPHOS] @zsnout/ithkuil loaded — live morphology active');
  }catch(e){
    console.warn('[MORPHOS] zsnout unavailable:',e&&e.message||String(e));
    window.IK={loaded:false,version:'placeholder'};
    window.dispatchEvent(new CustomEvent('ithkuil-loaded',{detail:{version:'placeholder'}}));
  }
}
loadIK();
window._pendingDrill=null;
window._launchPhonoDrill=function(id,def){
  window._pendingDrill={id,def};
  window.dispatchEvent(new CustomEvent('launch-drill',{detail:{id,def}}));
};
</script>
