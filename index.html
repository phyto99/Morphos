<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MORPHOS v2 — Ithkuil IV Learning Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
:root {
  --bg: #08080e; --surface: #0f0f1a; --card: #161623; --border: #252538;
  --text: #dde0f5; --muted: #6e7099; --bright: #f0f2ff;
  --accent: #3730a3; --accent2: #4338ca;
  --slot-cc:#4b5563; --slot-vv:#1d4ed8; --slot-cr:#b91c1c; --slot-vr:#c2410c;
  --slot-cs:#92400e; --slot-vx:#4d7c0f; --slot-ca:#15803d; --slot-vn:#0f766e; --slot-vc:#6d28d9;
  --p-cfg:#16a34a; --p-afl:#0d9488; --p-per:#7c3aed; --p-ext:#b45309;
  --p-ess:#c2410c; --p-spc:#b91c1c; --p-fn:#6d28d9; --p-cas:#1d4ed8;
  --p-moo:#0e7490; --p-val:#0f766e; --p-bia:#be185d; --p-asp:#7e22ce;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); }
body { color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; line-height: 1.6; overflow-x: hidden; }
#root { height: 100%; display: flex; flex-direction: column; }
h1,h2,h3,h4 { font-family: 'Cinzel', serif; letter-spacing: 0.04em; }
.fraunces { font-family: 'Fraunces', serif; font-style: italic; }
.mono { font-family: 'IBM Plex Mono', monospace; }
.ithkuil { font-family: 'IBM Plex Mono', monospace; font-weight: 600; letter-spacing: 0.08em; }

/* SCROLLBARS */
.sy::-webkit-scrollbar, .scroll-y::-webkit-scrollbar { width: 4px; }
.sy::-webkit-scrollbar-thumb, .scroll-y::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.sy { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.scroll-y { overflow-y: auto; }

/* LAYOUT */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 180px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.content { flex: 1; overflow-y: auto; padding: 24px; min-width: 0; }

/* CARDS */
.card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.card2 { background: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 12px; }
.glass { background: rgba(255,255,255,.02); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }

/* BUTTONS */
.btn { padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; font-weight: 500; transition: all 0.15s; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-primary { background: #3730a3; color: white; }
.btn-primary:hover:not(:disabled) { background: #4338ca; }
.btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
.btn-ghost:hover:not(:disabled) { border-color: #4338ca; color: var(--text); }
.btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 5px; }
.btn-xs { padding: 2px 7px; font-size: 11px; border-radius: 4px; }
.btn-icon { padding: 6px; border-radius: 6px; }

/* NAV */
.nav-btn { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; border: none; cursor: pointer; background: transparent; color: var(--muted); font-family: 'IBM Plex Sans', sans-serif; font-size: 12px; font-weight: 400; width: 100%; text-align: left; transition: all 0.12s; }
.nav-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.nav-btn.active { color: var(--bright); background: rgba(67,56,202,0.25); font-weight: 600; }
.nav-icon { width: 16px; text-align: center; font-size: 11px; flex-shrink: 0; opacity: 0.8; }
.nav-section { font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 8px 10px 4px; }

/* FORMS */
select, input[type=text], textarea { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; width: 100%; outline: none; transition: border-color .15s; }
select:focus, input[type=text]:focus, textarea:focus { border-color: #4338ca; }
option { background: var(--surface); }
label.rl { display: flex; align-items: flex-start; gap: 9px; cursor: pointer; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); transition: all .12s; }
label.rl:hover { border-color: #4338ca44; }
label.rl.sel { border-color: currentColor; }
input[type=radio] { accent-color: #4338ca; margin-top: 2px; flex-shrink: 0; }

/* SLOT BLOCKS */
.slot-block { display: inline-flex; flex-direction: column; align-items: center; border-radius: 6px; padding: 6px 10px; min-width: 60px; cursor: pointer; transition: opacity 0.15s; }
.slot-block:hover { opacity: 0.85; }
.slot-label, .slot-lbl { font-size: 9px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.75; margin-bottom: 2px; }
.slot-value, .slot-val { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; }
.slot-name, .slot-sub { font-size: 9px; opacity: 0.6; margin-top: 2px; }
.slot { display: inline-flex; flex-direction: column; align-items: center; border-radius: 6px; padding: 5px 9px; min-width: 52px; cursor: pointer; transition: transform .12s, box-shadow .12s; }
.slot:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,.4); }

/* PROGRESS */
.progress-bar, .pbar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill, .pfill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.pbar5 { height: 5px; }

/* BADGES & PILLS */
.param-badge, .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; font-weight: 500; }
.phase-tag, .tag { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; }
.pill { display: inline-block; padding: 1px 7px; border-radius: 10px; font-size: 10px; font-weight: 500; }

/* ANIMATIONS */
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes glow { 0%,100% { box-shadow: 0 0 0 rgba(67,56,202,0); } 50% { box-shadow: 0 0 20px rgba(67,56,202,.35); } }
.anim-fade, .fade-up { animation: fadeIn 0.2s ease; }
/* smooth colour transitions when theme/brightness changes */
body, .card, .card2, .glass, .sidebar, .topbar, .nav-btn, .btn, .tab, .slot, .slot-block, .syn-cell, select, input, textarea, label.rl { transition-property: background-color, border-color, color; transition-duration: .25s; transition-timing-function: ease; }
.pulse { animation: pulse 1.5s infinite; }
.glow-text { text-shadow: 0 0 20px rgba(99,102,241,0.5); }

/* RESULT STATES */
.dot-correct { color: #22c55e; } .dot-wrong { color: #ef4444; }
.correct-bg { background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3) !important; }
.wrong-bg { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3) !important; }

/* SYNESTHETIC */
.synth-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 1000; mix-blend-mode: screen; }
.syn-aura { transition: box-shadow .3s, border-color .3s; }
.syn-active { animation: glow 2s infinite; }

/* TABS */
.tab { padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.12s; white-space: nowrap; color: var(--muted); }
.tab:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.tab.active { color: var(--bright); background: rgba(67,56,202,0.3); border-bottom: 2px solid #4338ca; }

/* TOOLTIP */
.tip-wrap { position: relative; display: inline-block; }
.tip { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #1a1a2e; border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 11px; white-space: nowrap; z-index: 100; pointer-events: none; opacity: 0; transition: opacity .15s; }
.tip-wrap:hover .tip { opacity: 1; }

/* GRID UTILITIES */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.g4 { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
.flex { display: flex; align-items: center; }
.flex-col { display: flex; flex-direction: column; }
.gap4{gap:4px} .gap6{gap:6px} .gap8{gap:8px} .gap10{gap:10px} .gap12{gap:12px} .gap14{gap:14px}
.mb4{margin-bottom:4px} .mb6{margin-bottom:6px} .mb8{margin-bottom:8px} .mb10{margin-bottom:10px} .mb12{margin-bottom:12px} .mb14{margin-bottom:14px} .mb16{margin-bottom:16px}

/* PUZZLE CARDS */
.puzzle-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.15s; }
.puzzle-card:hover { border-color: #4338ca44; transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.5); }

/* SYNESTHETIC CHART */
.syn-row { display: flex; align-items: stretch; gap: 0; border-radius: 6px; overflow: hidden; margin-bottom: 3px; }
.syn-cell { flex: 1; padding: 5px 4px; text-align: center; font-size: 9px; font-weight: 600; letter-spacing: .04em; transition: all .2s; cursor: pointer; }
.syn-cell:hover { filter: brightness(1.4); }
.syn-cell.active { outline: 2px solid white; z-index: 1; }

/* SCENARIO CANVAS */
.scenario-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-height: 120px; display: flex; align-items: center; justify-content: center; }
.stage { padding: 8px 12px; border-radius: 6px; border: 1px solid; font-size: 13px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useReducer,useEffect,useRef,useCallback,useMemo}=React;

/* ══════════════════════════════════════════════════════════════════
   LAYER 1 — SYNESTHETIC AUDIO ENGINE
   Each parameter value maps to a specific musical frequency.
   The learner hears the morphology as they select it.
   ══════════════════════════════════════════════════════════════════ */
let audioCtx=null;
const getAudioCtx=()=>{
  if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
};
// Each param dimension is a musical "register"; values are notes within it
const TONE_MAP={
  // Configuration: C major scale, grounding, structural (low register 200-400Hz)
  UNI:261.6, DPX:293.7, DCT:329.6, AGG:349.2, SEG:392.0, CPN:440.0, COH:493.9, CST:523.3, MUL:587.3,
  // Affiliation: Perfect 4ths (warm, relational, mid register)
  CSL:330.0, ASO:440.0, VAR:550.0, COA:660.0,
  // Perspective: Octave relationships (metaphysical, high register)
  M:220.0, P:440.0, N:880.0, A:1760.0,
  // Extension: Chromatic semitones (spatial gradation)
  DEL:370.0, PRX:311.1, DST:415.3, PXD:466.2, ICP:277.2, TRM:391.0,
  // Essence: Major vs minor (actuality contrast)
  NRM:440.0, RPV:415.3,
  // Specification: Chord tones
  BSC:261.6, CTE:329.6, CSV:392.0, OBJ:523.3,
  // Mood: Pentatonic (flowing, stance)
  FAC:392.0, SUB:440.0, ASM:493.9, SPE:523.3, CNT:349.2, IPT:587.3,
  // Validation: Lydian mode (epistemic light)
  OBS:523.3, RCL:493.9, PUR:466.2, RPR:440.0, APR:415.3, IMG:392.0,
  // Bias: Chromatic (emotional range)
  EUP:587.3, EUH:554.4, COR:523.3, DUB:493.9, TEN:466.2, NEG:440.0, SKP:415.3, CYN:391.0, CTM:369.9, EXA:349.2,
};
function playTone(freq,dur=0.12,type='sine',vol=0.08){
  if(!freq) return;
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type=type; osc.frequency.value=freq;
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(vol,ctx.currentTime+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime+dur+0.05);
  }catch(e){}
}
function playChord(freqs,dur=0.25,type='sine'){
  freqs.forEach(f=>playTone(f,dur,type,0.05));
}
function playCaChord(cfg,afl,per){
  playChord([TONE_MAP[cfg],TONE_MAP[afl],TONE_MAP[per]].filter(Boolean),0.35,'sine');
}

   Future: API-replace with /roots, /affixes, /cases endpoints.
   ══════════════════════════════════════════════════════════════════ */

      {id:"CSL",label:"Consolidative",icon:"≡",desc:"Members identical in nature and function",freq:330,hue:"#0d9488"},

      {id:"PRX",label:"Proximal",     icon:"◄",desc:"The near portion only",                    freq:311.1,hue:"#92400e"},
      {id:"DST",label:"Distal",       icon:"►",desc:"The far portion only",                     freq:415.3,hue:"#d97706"},

/* Simplified Ithkuil form generator — structural placeholder for DB integration */
function buildForm(p){
  const rMap={KŢ:"kţ",MŘ:"mř",ŇV:"ňv",ŽB:"žb",RŇ:"rň",VŽ:"vž",KF:"kf",
    ŢM:"ţm",XL:"xl",ŘK:"řk",PŘ:"př",NŢ:"nţ",KV:"kv",ŽL:"žl",RM:"rm",
    ŢV:"ţv",FL:"fl",ŇM:"ňm",LK:"lk",ŢR:"ţr"};
  const vr={S1P1:"a",S1P2:"e",S1P3:"i",S2P1:"u",S2P2:"o",S2P3:"ö",S3P1:"â",S3P2:"ê",S3P3:"î"};
  const specMap={BSC:"",CTE:"a",CSV:"e",OBJ:"i"};
  const caMap={
    UNI_CSL:"l",DPX_CSL:"r",DCT_CSL:"v",AGG_CSL:"tļ",SEG_CSL:"lm",CPN_CSL:"vr",COH_CSL:"zm",CST_CSL:"nļ",MUL_CSL:"ňv",
    UNI_ASO:"lf",UNI_VAR:"ls",UNI_COA:"lç",AGG_ASO:"tļf",AGG_VAR:"tļs",COH_ASO:"zmf",CPN_COA:"vrç",
  };
  const perMap={M:"",P:"r",N:"ř",A:"š"};
  const extMap={DEL:"",PRX:"t",DST:"k",PXD:"tk",ICP:"f",TRM:"p"};
  const vcMap={THM:"a",INS:"â",ABS:"e",ERG:"ê",DAT:"i",GEN:"î",ATR:"u",PRP:"û",PUR:"o",LOC:"ô",ALL:"ö",ABL:"ae",TMP:"ea",FNC:"oa",APP:"ao"};
  const r=rMap[p.root]||"kt";
  const v=(vr[`${p.stem||"S1"}${p.pattern||"P1"}`]||"a")+(specMap[p.specification||"BSC"]||"");
  const caKey=`${p.configuration||"UNI"}_${p.affiliation||"CSL"}`;
  const ca=(caMap[caKey]||"l")+(perMap[p.perspective||"M"]||"")+(extMap[p.extension||"DEL"]||"");
  const vc=vcMap[p.case||"THM"]||"a";
  return r+v+ca+vc;
}

/* Competence stage calc */
const calcStage=lm=>{
  const allVals=Object.entries(lm).filter(([k])=>PARAMS[k]).flatMap(([,v])=>Object.values(v));
  const avg=allVals.length?allVals.reduce((a,b)=>a+b,0)/allVals.length:0;
  if(avg<0.25) return 1;
  if(avg<0.55) return 2;
  if(avg<0.80) return 3;
  return 4;
};

/* ── GLOSSARY & Term tooltip component ───────────────────────────────────────
   Difficult words in descriptions are wrapped in <Term>. On hover, shows a
   compact definition inline. Click swaps to extended explanation.
   ──────────────────────────────────────────────────────────────────────────── */
const GLOSSARY={
  ontology:     {short:"study of what exists",         long:"The branch of philosophy concerned with the fundamental categories of being — what kinds of things exist and how they relate."},
  morphology:   {short:"word-form structure",           long:"The study of how words are formed from smaller meaningful units (morphemes). In Ithkuil, a single word can encode 12+ simultaneous dimensions."},
  morpheme:     {short:"smallest meaning unit",         long:"The smallest unit of a language that carries meaning. In Ithkuil, each slot in the word structure (Cr, Ca, Vr…) is a morpheme."},
  deictic:      {short:"pointing/indexical",            long:"A word or feature that depends on context to convey meaning — 'this', 'here', 'now'. Deictic words point to things relative to the speaker's position."},
  noumenal:     {short:"category/type itself",          long:"In Ithkuil, the Noumenal perspective encodes the Platonic type or category of a thing — not any particular instance, but the kind of thing it is."},
  monadic:      {short:"single bounded instance",       long:"The Monadic perspective refers to one specific, individuated, bounded instance of something — this particular dog, not dogs in general."},
  polyadic:     {short:"a set of instances",            long:"The Polyadic perspective refers to a plurality of instances treated as a set — these dogs, not dogness or the category 'dog'."},
  deontic:      {short:"relating to obligation/norms",  long:"Deontic logic deals with permission, obligation, and prohibition. In Ithkuil, the Mood parameter encodes the speaker's deontic relationship to a proposition."},
  epistemic:    {short:"relating to knowledge/belief",  long:"Epistemology is the study of knowledge and justified belief. Epistemic stance encodes how the speaker knows or believes what they're asserting."},
  stative:      {short:"describes a state",             long:"A stative predicate describes a condition, property, or state of affairs — 'is red', 'believes', 'knows'. Contrasts with Dynamic (active processes)."},
  evidential:   {short:"source of knowledge marker",   long:"An evidential marks how the speaker came to know what they're asserting — by direct observation, hearsay, inference, memory, etc."},
  holophrase:   {short:"single-word sentence",          long:"A single utterance that expresses a complete proposition. Ithkuil is famous for encoding entire paragraphs of English into a single morphological form."},
  phonotactics: {short:"rules for sound sequences",    long:"The constraints on which sequences of sounds are permissible in a language. Ithkuil has complex phonotactic rules that determine valid consonant clusters."},
  formative:    {short:"core word structure",           long:"In Ithkuil, a formative is the primary word type — it encodes a full predication including root, configuration, case, mood, and all other parameters."},
  configurative:{short:"how instances are arranged",   long:"Configuration in Ithkuil encodes how many instances there are and how they're spatially/logically arranged — uniplex, duplex, discrete, aggregative, etc."},
};

function Term({word,children}){
  const[expanded,setExpanded]=useState(false);
  const[visible,setVisible]=useState(false);
  const ref=useRef(null);
  const entry=GLOSSARY[word?.toLowerCase()]||GLOSSARY[(children?.toString()||'').toLowerCase()];
  if(!entry) return <span>{children||word}</span>;
  return(
    <span ref={ref} style={{position:'relative',display:'inline'}}
      onMouseEnter={()=>setVisible(true)}
      onMouseLeave={()=>{setVisible(false);setExpanded(false);}}>
      <span style={{borderBottom:'1px dotted var(--accent2)',cursor:'help',color:'var(--bright)'}}
        onClick={e=>{e.stopPropagation();setExpanded(v=>!v);}}>
        {children||word}
      </span>
      {visible&&(
        <span style={{position:'absolute',bottom:'calc(100% + 5px)',left:'50%',transform:'translateX(-50%)',
          background:'#13132a',border:'1px solid var(--border2)',borderRadius:6,padding:'7px 10px',
          fontSize:10,lineHeight:1.5,zIndex:200,whiteSpace:'nowrap',maxWidth:280,whiteSpace:'normal',
          boxShadow:'0 8px 24px rgba(0,0,0,.6)',pointerEvents:'none',display:'block'}}>

        </span>
      )}
    </span>
  );
}

/* ══════════════════════════════════════════════════════════════════
   LAYER 6 — MORPHEME ARCHITECTURE VISUALIZER (MAV)
   ══════════════════════════════════════════════════════════════════ */
function MAV({params,synOn}){
  const[hov,setHov]=useState(null);
  const form=buildForm(params);
  const root=ROOTS.find(r=>r.id===params.root)||ROOTS[0];
  const slotDefs=[
    {s:"Cc",v:"—",  desc:"No concatenation",c:"#374151"},
    {s:"Vv",v:"a",  desc:"Process version",c:"#1e3a8a"},
    {s:"Cr",v:root.id, desc:`Root: ${root.name}`,c:"#991b1b"},
    {s:"Vr",v:`${(params.stem||"S1").replace("S","")}·${(params.pattern||"P1").replace("P","")}`,
     desc:`${params.stem||"S1"} · ${params.pattern||"P1"} · ${params.specification||"BSC"}`,c:"#9a3412"},
    {s:"Cs",v:"—",  desc:"No incorporated root",c:"#78350f"},
    {s:"Vx",v:"—",  desc:"No affixes",c:"#365314"},
    {s:"Ca",v:`${(params.configuration||"UNI").slice(0,3)}`,
     desc:`${params.configuration} · ${params.affiliation} · ${params.perspective} · ${params.extension} · ${params.essence}`,c:"#14532d"},
    {s:"Vn",v:params.mood==="FAC"?"—":(params.mood||"FAC").slice(0,3),
     desc:`Mood:${params.mood||"FAC"} · Valid:${params.validation||"OBS"}`,c:"#134e4a"},
    {s:"Vc",v:params.case||"THM", desc:`Case: ${CASES.find(c=>c.id===params.case)?.label||"Thematic"}`,c:"#4c1d95"},
  ];
  return(
    <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:8,padding:14,position:'relative'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:10}}>
        <span style={{fontSize:9,fontWeight:700,letterSpacing:'.12em',textTransform:'uppercase',color:'var(--muted)'}}>Morpheme Architecture</span>
        <div className="flex gap8">
          {synOn&&<span style={{fontSize:9,color:PARAMS.configuration.hex}}>◈ synesthetic</span>}
          <span className="ithkuil" style={{fontSize:22,color:'var(--bright)',letterSpacing:'.12em'}}>{form}</span>
        </div>
      </div>
      <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>
        {slotDefs.map(sl=>(
          <div key={sl.s} className="slot" style={{background:sl.c+'22',border:`1px solid ${hov?.s===sl.s?sl.c:sl.c+'55'}`,
            boxShadow:hov?.s===sl.s?`0 0 10px ${sl.c}44`:'none'}}
            onMouseEnter={()=>{setHov(sl);if(synOn)playTone(TONE_MAP[sl.v]||330,0.1);}}
            onMouseLeave={()=>setHov(null)}>
            <span className="slot-lbl" style={{color:sl.c}}>{sl.s}</span>
            <span className="slot-val" style={{color:sl.c}}>{sl.v}</span>
          </div>
        ))}
      </div>
      {hov&&(
        <div className="fade-up" style={{marginTop:8,padding:'7px 10px',borderRadius:6,
          background:hov.c+'18',border:`1px solid ${hov.c}44`,fontSize:11}}>
          <span style={{color:hov.c,fontWeight:600}}>{hov.s}: </span>
          <span style={{color:'var(--muted)'}}>{hov.desc}</span>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   LAYER 7 — PARAMETER SELECTION PANEL
   ══════════════════════════════════════════════════════════════════ */
function PSP({params,onChange,synOn}){
  const[openGroup,setOpenGroup]=useState("ca");
  const groups=[
    {id:"ca",  title:"Ca Complex",note:"The morphological heart — 5 simultaneous dimensions",
     keys:["configuration","affiliation","perspective","extension","essence"],hex:"#14532d"},
    {id:"vr",  title:"Vr Complex",note:"Root · Stem · Pattern · Specification · Function",
     keys:["specification","function"],hex:"#9a3412"},
    {id:"reg", title:"Register",note:"Mood · Validation · Bias · Aspect",
     keys:["mood","validation","bias","aspect"],hex:"#134e4a"},
  ];
  return(
    <div className="flex-col gap8">
      {groups.map(g=>(
        <div key={g.id} style={{background:'var(--card)',border:`1px solid ${g.hex+'44'}`,borderRadius:8,padding:14}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',marginBottom:openGroup===g.id?10:0}}
            onClick={()=>setOpenGroup(openGroup===g.id?null:g.id)}>
            <div>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:g.hex}}>{g.title}</div>
              {openGroup!==g.id&&<div style={{fontSize:9,color:'var(--muted)'}}>{g.note}</div>}
            </div>
            <span style={{color:g.hex,fontSize:12}}>{openGroup===g.id?"▾":"▸"}</span>
          </div>
          {openGroup===g.id&&(
            <div className="flex-col gap10">
              {g.keys.map(k=>(
                <div key={k}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                    <span style={{fontSize:9,fontWeight:700,letterSpacing:'.09em',textTransform:'uppercase',color:PARAMS[k]?.hex}}>{PARAMS[k]?.label}</span>
                    <span style={{fontSize:9,color:'var(--muted)',fontStyle:'italic'}}>{PARAMS[k]?.spatialAxis}</span>
                  </div>
                  <ParamStrip paramKey={k} selectedId={params[k]} onChange={v=>{
                    if(synOn&&TONE_MAP[v])playTone(TONE_MAP[v],0.18,'sine');
                    if(k==="configuration"||k==="affiliation"||k==="perspective")
                      playCaChord(
                        k==="configuration"?v:params.configuration,
                        k==="affiliation"?v:params.affiliation,
                        k==="perspective"?v:params.perspective
                      );
                    onChange({...params,[k]:v});
                  }} synOn={synOn} showLabel={false}/>
                  {params[k]&&<div style={{marginTop:4,fontSize:10,color:'var(--muted)',lineHeight:1.4}}>
                    {PARAMS[k]?.values.find(v=>v.id===params[k])?.desc}
                  </div>}
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
      {/* Root + Stem + Case */}
      <div style={{background:'var(--card)',border:'1px solid #991b1b44',borderRadius:8,padding:14}}>
        <div style={{fontSize:10,fontWeight:700,letterSpacing:'.1em',textTransform:'uppercase',color:'#991b1b',marginBottom:8}}>Root · Stem · Case</div>
        <div className="g2 gap8 mb8">
          <div>
            <label style={{fontSize:9,color:'var(--muted)',display:'block',marginBottom:3}}>Root</label>
            <select value={params.root||"KŢ"} onChange={e=>onChange({...params,root:e.target.value})}>
              {ROOTS.map(r=><option key={r.id} value={r.id}>{r.id} — {r.name}</option>)}
            </select>
          </div>
          <div>
            <label style={{fontSize:9,color:'var(--muted)',display:'block',marginBottom:3}}>Stem · Pattern</label>
            <div style={{display:'flex',gap:4}}>
              <select value={params.stem||"S1"} onChange={e=>onChange({...params,stem:e.target.value})} style={{flex:1}}>
                {[1,2,3].map(s=><option key={s} value={`S${s}`}>Stem {s}</option>)}
              </select>
              <select value={params.pattern||"P1"} onChange={e=>onChange({...params,pattern:e.target.value})} style={{flex:1}}>
                {[1,2,3].map(p=><option key={p} value={`P${p}`}>Pat {p}</option>)}
              </select>
            </div>
          </div>
        </div>
        <div>
          <label style={{fontSize:9,color:'var(--muted)',display:'block',marginBottom:3}}>Case</label>
          <select value={params.case||"THM"} onChange={e=>onChange({...params,case:e.target.value})}>
            {CASES.map(c=><option key={c.id} value={c.id}>[{c.family}] {c.label} — {c.desc.slice(0,36)}</option>)}
          </select>
        </div>
      </div>
    </div>
  );
}

/* --- 8.7 COMPRESSION SPRINT ----------------------------------------- */
function CompressionSprint({synOn}){
  const targets=[
    {id:"cs1",text:"Multiple specialists with different skills who had previously been working independently but are now coordinating their efforts toward a shared goal.",
     hint:"COH or CPN config? COA affiliation? OBJ specification?",
     model:{configuration:"CPN",affiliation:"COA",perspective:"M",specification:"OBJ"},charCount:45},
    {id:"cs2",text:"The way in which a child gradually and unexpectedly comes to understand something that had previously been opaque to them.",
     hint:"Aspect: INC or HAB? Validation: OBS? Bias: EUP?",
     model:{aspect:"INC",root:"MŘ",stem:"S2",function:"DYN",bias:"EUP"},charCount:38},
    {id:"cs3",text:"Every instance of the abstract property of connectedness that could ever be instantiated, considered as a pure formal structure.",
     hint:"Perspective: A? Root ŇM? Extension DEL? Essence RPV?",
     model:{perspective:"A",root:"ŇM",extension:"DEL",essence:"RPV"},charCount:32},
  ];
  const[idx,setIdx]=useState(0);
  const[timer,setTimer]=useState(60);
  const[running,setRunning]=useState(false);
  const[params,setParams]=useState(defaultP());
  const[score,setScore]=useState(null);
  const timerRef=useRef(null);
  const t=targets[idx];
  useEffect(()=>{
    if(running&&timer>0) timerRef.current=setTimeout(()=>setTimer(v=>v-1),1000);
    else if(timer===0) {setRunning(false);calcScore();}
    return()=>clearTimeout(timerRef.current);
  },[running,timer]);
  const start=()=>{setTimer(60);setRunning(true);setScore(null);setParams(defaultP());};
  const calcScore=()=>{
    let pts=0;
    Object.entries(t.model).forEach(([k,v])=>{if(params[k]===v)pts+=20;});
    const form=buildForm(params);
    setScore({pts,form,timeLeft:timer});
  };
  const submit=()=>{setRunning(false);calcScore();};
  return(
    <div className="flex-col gap10">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {targets.map((t2,i)=><button key={i} className={`btn btn-sm ${idx===i?'btn-primary':'btn-ghost'}`}
            onClick={()=>{setIdx(i);setScore(null);setRunning(false);setTimer(60);setParams(defaultP());}}>Sprint {i+1}</button>)}
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <span style={{fontFamily:'IBM Plex Mono',fontSize:16,color:timer<15?'#ef4444':'var(--text)'}}>{timer}s</span>
          {!running&&<button className="btn btn-primary btn-sm" onClick={start}>Start</button>}
          {running&&<button className="btn btn-ghost btn-sm" onClick={submit}>Submit</button>}
        </div>
      </div>
      <div className="card" style={{borderColor:'#c2410c44'}}>
        <div style={{fontSize:9,color:'#c2410c',fontWeight:700,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:6}}>Compress This</div>
        <p style={{fontSize:13,lineHeight:1.7,color:'var(--bright)'}}>{t.text}</p>
        <p style={{fontSize:10,color:'var(--muted)',marginTop:6,fontStyle:'italic'}}>Hint: {t.hint}</p>
      </div>
      {running&&(
        <div className="fade-up">
          <div style={{marginBottom:8,fontWeight:600,fontSize:11,color:'var(--muted)'}}>Set your parameters:</div>
          <ParamStrip paramKey="configuration" selectedId={params.configuration} onChange={v=>setParams(p=>({...p,configuration:v}))} synOn={synOn}/>
          <div style={{marginTop:6}}><ParamStrip paramKey="affiliation" selectedId={params.affiliation} onChange={v=>setParams(p=>({...p,affiliation:v}))} synOn={synOn}/></div>
          <div style={{marginTop:6}}><ParamStrip paramKey="perspective" selectedId={params.perspective} onChange={v=>setParams(p=>({...p,perspective:v}))} synOn={synOn}/></div>
          <div style={{marginTop:6}}><ParamStrip paramKey="specification" selectedId={params.specification} onChange={v=>setParams(p=>({...p,specification:v}))} synOn={synOn}/></div>
          <div style={{marginTop:6}}><ParamStrip paramKey="essence" selectedId={params.essence} onChange={v=>setParams(p=>({...p,essence:v}))} synOn={synOn}/></div>
          <div style={{marginTop:8}}><MAV params={params} synOn={synOn}/></div>
        </div>
      )}
      {score&&(
        <div className="card fade-up" style={{borderColor:'#4338ca44'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <span style={{fontWeight:700,color:'var(--bright)',fontSize:14}}>Score: {score.pts}/100</span>
            <span className="ithkuil" style={{fontSize:20,color:'#a5b4fc'}}>{score.form}</span>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}}>
            {Object.entries(t.model).map(([k,v])=>(
              <div key={k} style={{fontSize:11,padding:'4px 8px',borderRadius:4,
                background:params[k]===v?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)',
                color:params[k]===v?'#22c55e':'#ef4444'}}>
                {PARAMS[k]?.label}: {params[k]===v?`✓ ${v}`:` ✗ ${params[k]||'—'} (want ${v})`}
              </div>
            ))}
          </div>
        </div>
      )}

  );

/* --- 8.8 MORPHOLOGICAL SUDOKU --------------------------------------- */
function MorphSudoku(){
  // A 3×3 grid where each row must have all 3 Configuration values from a family,
  // each column must have all 3 Affiliation values, and each cell must be unique.
  const configRows=[["UNI","DPX","DCT"],["AGG","SEG","CPN"],["COH","CST","MUL"]];
  const aflCols=[["CSL","ASO","VAR"],["ASO","VAR","COA"],["CSL","VAR","COA"]];
  // Puzzle: 3x3 grid, some cells pre-filled, learner fills rest
  const puzzle=[
    [{cfg:"UNI",afl:"CSL",fixed:true},{cfg:"DPX",afl:"ASO",fixed:false},{cfg:"DCT",afl:"VAR",fixed:true}],
    [{cfg:"AGG",afl:"COA",fixed:true},{cfg:"SEG",afl:"CSL",fixed:false},{cfg:"CPN",afl:"ASO",fixed:false}],
    [{cfg:"COH",afl:"ASO",fixed:false},{cfg:"CST",afl:"VAR",fixed:true},{cfg:"MUL",afl:"COA",fixed:true}],
  ];
  const[grid,setGrid]=useState(puzzle.map(row=>row.map(cell=>({...cell,userCfg:cell.fixed?cell.cfg:"",userAfl:cell.fixed?cell.afl:""}))));
  const[checked,setChecked]=useState(false);
  const check=()=>setChecked(true);
  const isCorrect=(r,c)=>grid[r][c].userCfg===puzzle[r][c].cfg&&grid[r][c].userAfl===puzzle[r][c].afl;
  const cfgOptions=["UNI","DPX","DCT","AGG","SEG","CPN","COH","CST","MUL"];
  const aflOptions=["CSL","ASO","VAR","COA"];
  return(
    <div>
      <div style={{marginBottom:10,fontSize:12,color:'var(--muted)',lineHeight:1.6}}>
        Fill in the empty cells. Each row must contain three different Configuration values. Each column must contain three different Affiliation values. No cell may repeat in its row or column.
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:6,marginBottom:10}}>
        {grid.map((row,r)=>row.map((cell,c)=>(
          <div key={`${r}${c}`} className="card2" style={{
            borderColor:checked?(isCorrect(r,c)?'#22c55e66':'#ef444466'):'var(--border)',
            background:cell.fixed?'var(--surface)':checked?(isCorrect(r,c)?'rgba(34,197,94,.05)':'rgba(239,68,68,.05)'):'var(--card2)'}}>
            <div style={{fontSize:8,color:'var(--muted)',marginBottom:4,textTransform:'uppercase',letterSpacing:'.08em'}}>R{r+1}·C{c+1}{cell.fixed?'·fixed':''}</div>
            {cell.fixed?(
              <div>
                <div style={{fontSize:10,color:PARAMS.configuration.hex,fontWeight:600}}>{cell.cfg}</div>
                <div style={{fontSize:10,color:PARAMS.affiliation.hex,fontWeight:600}}>{cell.afl}</div>
              </div>
            ):(
              <div className="flex-col gap4">
                <select value={cell.userCfg} onChange={e=>{const ng=[...grid.map(row=>[...row])];ng[r][c]={...ng[r][c],userCfg:e.target.value};setGrid(ng);setChecked(false);}}>
                  <option value="">CFG</option>
                  {cfgOptions.map(o=><option key={o} value={o}>{o}</option>)}
                </select>
                <select value={cell.userAfl} onChange={e=>{const ng=[...grid.map(row=>[...row])];ng[r][c]={...ng[r][c],userAfl:e.target.value};setGrid(ng);setChecked(false);}}>
                  <option value="">AFL</option>
                  {aflOptions.map(o=><option key={o} value={o}>{o}</option>)}
                </select>
              </div>
            )}
          </div>
        )))}
      </div>
      <div style={{display:'flex',gap:8}}>
        <button className="btn btn-primary" onClick={check}>Check Grid</button>
        <button className="btn btn-ghost" onClick={()=>{setGrid(puzzle.map(row=>row.map(cell=>({...cell,userCfg:cell.fixed?cell.cfg:"",userAfl:cell.fixed?cell.afl:""}))));setChecked(false);}}>Reset</button>
      </div>
      {checked&&<div style={{marginTop:8,fontSize:11,color:grid.every((row,r)=>row.every((_,c)=>isCorrect(r,c)))?'#22c55e':'#f59e0b'}}>
        {grid.every((row,r)=>row.every((_,c)=>isCorrect(r,c)))?'✓ Perfect! All cells correct.':'Some cells incorrect. Review row/column constraints.'}
      </div>}
    </div>
  );
}

const SORT_SCENARIOS=[

const PER_COLORS={M:"#7c3aed",P:"#6d28d9",N:"#8b5cf6",A:"#a78bfa"};

  const[assignments,setAssignments]=useState({});

  const assign=(idx,val)=>{if(!submitted){setAssignments(p=>({...p,[idx]:val}));if(synOn)playTone(PARAMS.perspective.values.find(v=>v.id===val)?.freq||440,0.15,'sine');}};

  const score=submitted?shuffled.filter((_,i)=>assignments[i]===shuffled[i].target).length:0;

    <div className="flex-col gap10">
      <div className="card" style={{borderColor:'#7c3aed44',marginBottom:4}}>

        </p>
      </div>
      {shuffled.map((sc,i)=>(

          <div style={{display:'flex',gap:4,flexWrap:'wrap'}}>

              const correct=submitted&&opt===sc.target;
              const wrong=submitted&&assignments[i]===opt&&opt!==sc.target;
              return<button key={opt} onClick={()=>assign(i,opt)}
                style={{padding:'5px 12px',borderRadius:5,border:`1px solid ${
                  correct?'#22c55e':wrong?'#ef4444':assignments[i]===opt?PER_COLORS[opt]:'var(--border)'}`,

                {opt} <span style={{fontSize:9,opacity:.7}}>·{PARAMS.perspective.values.find(v=>v.id===opt)?.label.slice(0,4)}</span>

        {submitted&&<button className="btn btn-ghost btn-sm" onClick={()=>{setAssignments({});setSubmitted(false);}}>Retry</button>}
      </div>
    </div>
  );
}

      {s:"Vr",v:"al",label:"Stem/Pattern",detail:"Stem 1, Pattern I — basic act of thinking",color:"#9a3412"},
      {s:"Ca",v:"m",label:"Ca complex",detail:"SEG·CSL·P·DEL·NRM — Segmentative, Consolidative, Polyadic, Delimitive, Normal",color:"#14532d"},
      {s:"Vc",v:"ö",label:"Case",detail:"Purposive — this set exists for the purpose of…",color:"#4c1d95"},
    ],
    key:"Ca is the heart: Segmentative (SEG) = arrangement was unified, now separated. Polyadic (P) = set of instances not a single one. These are different dimensions encoding different aspects simultaneously."
  },
  {
    form:"žblvra",label:"Speech: Coherent Associative Monadic Thematic",
    question:"Identify which dimension of the Ca slot distinguishes this from a mere collection of identical speech acts.",
    slots:[
      {s:"Cr",v:"žb",label:"Root",detail:"ŽB · Speech / Communication",color:"#991b1b"},
      {s:"Vr",v:"a",label:"Stem/Pattern",detail:"Stem 1, Pattern I — act of speaking",color:"#9a3412"},
      {s:"Ca",v:"lvr",label:"Ca complex",detail:"COH·ASO·M·DEL·NRM — Coherent, Associative, Monadic, Delimitive, Normal",color:"#14532d"},
      {s:"Vc",v:"a",label:"Case",detail:"Thematic — primary participant",color:"#4c1d95"},
    ],
    key:"COH (Coherent) = unified whole from heterogeneous parts — this is a communication system not a sum of speeches. ASO (Associative) = parts are similar in kind but functionally differentiated."
  },
  {
    form:"rmulça",label:"Value: Uniplex Coalescent Monadic Thematic",
    question:"Two learners disagree: one says this is a single value-judgment; another says it describes a merged value-system. Who is right and which dimension settles it?",
    slots:[
      {s:"Cr",v:"rm",label:"Root",detail:"RM · Value & Judgment",color:"#991b1b"},
      {s:"Vr",v:"u",label:"Stem/Pattern",detail:"Stem 2, Pattern I — entity judged good or bad",color:"#9a3412"},
      {s:"Ca",v:"lç",label:"Ca complex",detail:"UNI·COA·M·DEL·NRM — Uniplex, Coalescent, Monadic, Delimitive, Normal",color:"#14532d"},
      {s:"Vc",v:"a",label:"Case",detail:"Thematic — primary participant",color:"#4c1d95"},
    ],
    key:"UNI (Uniplex) = one instance, but COA (Coalescent) = previously distinct entities now merged into it. So: one merged value-system, formed from previously separate values. Configuration × Affiliation encode both simultaneously."
