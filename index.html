  {r:'b', ipa:'b',   place:'bilabial',      manner:'stop',           voice:true,  note:'as in English "bin"'},
  {r:'t', ipa:'t',   place:'alveolar',      manner:'stop',           voice:false, note:'as in English "tin"'},
  {r:'d', ipa:'d',   place:'alveolar',      manner:'stop',           voice:true,  note:'as in English "din"'},
  {r:'k', ipa:'k',   place:'velar',         manner:'stop',           voice:false, note:'as in English "kin"'},
  {r:'g', ipa:'g',   place:'velar',         manner:'stop',           voice:true,  note:'as in English "go"'},
  {r:'q', ipa:'q',   place:'uvular',        manner:'stop',           voice:false, note:'back-of-throat "k"; Arabic qaf'},
  {r:'ʼ', ipa:'ʔ',   place:'glottal',       manner:'stop',           voice:false, note:'catch between vowels; like "uh-oh"'},
  {r:'f', ipa:'f',   place:'labiodental',   manner:'fricative',      voice:false, note:'as in English "fan"'},
  {r:'v', ipa:'v',   place:'labiodental',   manner:'fricative',      voice:true,  note:'as in English "van"'},
  {r:'ţ', ipa:'θ',   place:'dental',        manner:'fricative',      voice:false, note:'as in English "thin"'},
  {r:'ḑ', ipa:'ð',   place:'dental',        manner:'fricative',      voice:true,  note:'as in English "this"'},
  {r:'s', ipa:'s',   place:'alveolar',      manner:'fricative',      voice:false, note:'as in English "sun"'},
  {r:'z', ipa:'z',   place:'alveolar',      manner:'fricative',      voice:true,  note:'as in English "zoo"'},
  {r:'š', ipa:'ʃ',   place:'postalveolar',  manner:'fricative',      voice:false, note:'as in English "ship"'},
  {r:'ž', ipa:'ʒ',   place:'postalveolar',  manner:'fricative',      voice:true,  note:'as in English "measure"'},
  {r:'ç', ipa:'ç',   place:'palatal',       manner:'fricative',      voice:false, note:'German "ich"; soft hiss'},
  {r:'x', ipa:'x',   place:'velar',         manner:'fricative',      voice:false, note:'Scottish "loch"; German "Bach"'},

const PHONO_RULES=[
  {rule:"Syllable Structure",desc:"Ithkuil allows complex onset clusters (up to 3 consonants) and codas (up to 2). Basic template: (C)(C)(C)V(C)(C).",example:"kţal, rmela, šţrâ"},
  {rule:"Gemination",desc:"Consonant doubling (gemination) marks morphological boundaries and can distinguish minimal pairs. Written as doubled letter.",example:"kalla vs kala"},
  {rule:"Valid Clusters",desc:"Initial clusters must obey sonority hierarchy: obstruent > nasal > liquid > glide. Exceptions exist for specific morpheme boundaries.",example:"str, kl, pr — valid; nl, mr — restricted"},
  {rule:"Epenthesis",desc:"A schwa-like vowel may be inserted between difficult clusters in careful speech. Not marked in writing.",example:"[kţ] may be realized as [kəţ]"},
  {rule:"Glottal Stop",desc:"ʼ appears between vowels across morpheme boundaries when no consonant intervenes. Prevents hiatus.",example:"a+â → aʼâ"},
  {rule:"Tone/Stress",desc:"Stress falls on the penultimate syllable by default. Morphological tone marking (high/low) is encoded in specific verbal affixes.",example:"'kţala vs kţa'la changes meaning"},
  {rule:"Pharyngeals",desc:"ħ triggers pharyngeal coarticulation: adjacent vowels become more retracted/low. ħ before /a/ → darker [ɑ].",example:"ħal → [ħɑl]"},
  {rule:"Glottalization",desc:"Certain Ca allomorphs involve glottalized stops. The glottal stop ʼ is a full phoneme, not just a breathing mark.",example:"ʼt, ʼk as distinct from t, k"},
  {rule:"Voicing Assimilation",desc:"In clusters, voicing partially assimilates: a voiced obstruent following a voiceless one may devoice partially.",example:"sb → [sp̬b] in fast speech"},
  {rule:"Lateral Fricative ļ",desc:"The voiceless lateral fricative ļ [ɬ] has no voiced counterpart. It's particularly common in Ca morphology.",example:"Ca marker -ļ for certain affiliation combos"},
];

/* Phonotactics checker — returns null if uncertain, true/false if determinable */
function checkCluster(seq){
  const VALID=['pr','pl','br','bl','tr','dr','kr','kl','gr','gl','fr','fl','str','spr','skr',
    'štr','špr','ţr','çr','xl','xr','st','sk','sp','zb','zd','zg','šk','šp','št','çk','çt'];
  const INVALID=['nl','mr','rl','lr','nm','mn','gg','pp','bb','dd','tt','kk','nb','ng','nd'];
  const s=seq.toLowerCase().replace(/\s/g,'');
  if(INVALID.some(c=>s.includes(c)))return false;
  if(VALID.some(c=>s===c||s.startsWith(c))&&s.length<=3)return true;
  return null;
}

/* ══════════════════════════════════════════════════════════════════
   LAYER 17C — LIVE ROOT HYDRATION
   When window.IK loads, enrich ROOTS with real stem descriptions.
   Lookup is by romanized consonant root (Cr field).
   ══════════════════════════════════════════════════════════════════ */
function useRootHydration(){
  const[hydrated,setHydrated]=useState(false);
  useEffect(()=>{
    const hydrate=()=>{
      if(!window.IK?.rootIndex||hydrated)return;
      let enriched=0;
      ROOTS.forEach(r=>{
        const cr=(IK_ROOT[r.id]||r.id).toLowerCase();
        const live=window.IK.rootIndex[cr];
        if(live){
          // Merge live stem descriptions if available
          if(live.stems&&live.stems[0]&&!r._hydrated){
            r.stem1=live.stems[0]?.BSC||live.stems[0]||r.stem1;
            r.stem2=live.stems[1]?.BSC||live.stems[1]||r.stem2;
            r.stem3=live.stems[2]?.BSC||live.stems[2]||r.stem3;
            r.desc=live.refers||live.description||r.desc;
            r._hydrated=true;
            enriched++;
          }
        }
      });
      if(enriched>0){
        setHydrated(true);
        console.info(`[MORPHOS] Hydrated ${enriched} roots from live zsnout data`);
      }
    };
    if(window.IK?.loaded) hydrate();
    const h=()=>hydrate();
    window.addEventListener('ithkuil-loaded',h);
    return()=>window.removeEventListener('ithkuil-loaded',h);
  },[hydrated]);
  return hydrated;
}

// Exact dark values for each endpoint — tint lerps between these
const DARK={
  lichess:{'--bg':'#0c0b0a','--surface':'#1b1917','--card':'#131211','--border':'#282522',
           '--text':'#d8d4cf','--muted':'#6e6a66','--bright':'#f0ece8'},
  discord:{'--bg':'#09090c','--surface':'#15161a','--card':'#0f1014','--border':'#222430',
           '--text':'#d4d6df','--muted':'#606370','--bright':'#eceef5'},
};
const LIGHT_TEXT={
  lichess:{'--text':'#201e1c','--muted':'#6e6a66','--bright':'#100e0c'},
  discord:{'--text':'#1a1b1e','--muted':'#60656e','--bright':'#060607'},
};

// brightness: 0-100 continuous — named stops: 0=amoled(black) 33=dark 66=ash 100=light
// tint: 0=lichess 100=discord
function computeVars(tint,brightness){
  const f=tint/100;
  const h2=(hex,i)=>parseInt(hex.slice(i,i+2),16);
  const lerpH=(a,b,t=f)=>{
    const r=Math.round(h2(a,1)*(1-t)+h2(b,1)*t);
    const g=Math.round(h2(a,3)*(1-t)+h2(b,3)*t);
    const bv=Math.round(h2(a,5)*(1-t)+h2(b,5)*t);
    return '#'+[r,g,bv].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');
  };
  const offsetH=(hex,off)=>{
    return '#'+[1,3,5].map(i=>Math.max(0,Math.min(255,h2(hex,i)+off)).toString(16).padStart(2,'0')).join('');
  };
  // Segment the 0-100 range into three zones:
  //   0=amoled(pure black) → 33=dark anchor → 66=ash → 100=light
  // For the amoled→dark segment we lerp each channel directly to black,
  // so the transition is perfectly proportional and never jumps.
  const t01=brightness<=33?brightness/33:1; // 0..1 within amoled→dark
  const isLight=brightness>=80;
  const vars={'--accent':'#3730a3','--accent2':'#4338ca'};
  for(const k of['--bg','--surface','--card','--border']){
    const darkBase=lerpH(DARK.lichess[k],DARK.discord[k]);
    let color;
    if(brightness<=33){
      // bg/surface/card lerp to pure black; border keeps a faint floor so separators stay visible
      const amoledFloor=k==='--border'?'#1a1a1a':'#000000';
      color=lerpH(amoledFloor,darkBase,t01);
    } else if(brightness<=66){
      const t=( brightness-33)/33;
      color=offsetH(darkBase,Math.round(18*t));
    } else {
      color=offsetH(darkBase,Math.round(18+202*(brightness-66)/34));
    }
    // border: never go below dark-8 in the ash→light range
    if(k==='--border'&&brightness>33){
      const darkBorder=lerpH(DARK.lichess[k],DARK.discord[k]);
      const minOff=-20;
      const rawOff=brightness<=66?Math.round(18*(brightness-33)/33):Math.round(18+202*(brightness-66)/34);
      color=offsetH(darkBorder,Math.max(rawOff,minOff));
    }
    vars[k]=color;
  }
  const txtSrc=isLight?LIGHT_TEXT:DARK;
  for(const k of['--text','--muted','--bright'])
    vars[k]=lerpH(txtSrc.lichess[k],txtSrc.discord[k]);
  return vars;
}

  const[synOn,setSynOn]=useState(true);
  const[lm,setLm]=useState(initLM());
  const[sandboxParams,setSP]=useState(defaultP());
  const[tint,setTint]=useState(50);
  const[brightness,setBrightness]=useState(33);
  const ik=useIthkuil();
  useRootHydration();

  useEffect(()=>{
    const vars=computeVars(tint,brightness);
    const root=document.documentElement;
    Object.entries(vars).forEach(([k,v])=>root.style.setProperty(k,v));
  },[tint,brightness]);

  const updateLM=useCallback((targetParams,correct)=>{
    setLm(prev=>{
      const n={...prev,
        totalAttempts:prev.totalAttempts+1,
        totalCorrect:prev.totalCorrect+(correct?1:0),
        xp:prev.xp+(correct?15:2),
        streak:correct?prev.streak+1:0,
      };
      Object.entries(targetParams).forEach(([k,v])=>{
        if(n[k]&&n[k][v]!==undefined){
          n[k]={...n[k],[v]:Math.min(1,n[k][v]+(correct?0.07:-0.02))};
        }
      });
      return n;
    });
  },[]);

  const navSections=[
    {id:"nav-learn",label:"Learn",items:[
      {id:"framework",icon:"⊙",label:"Philosophy"},
      {id:"dashboard",icon:"◈",label:"Dashboard"},
    ]},
    {id:"nav-train",label:"Train",items:[
      {id:"puzzles",icon:"⬡",label:"Puzzle Hall"},
      {id:"synesthetic",icon:"◉",label:"Synesthetic"},
      {id:"cdw",icon:"◆",label:"Decompose"},
      {id:"wde",icon:"⊘",label:"Deconstruct"},
    ]},
    {id:"nav-ref",label:"Reference",items:[
      {id:"sandbox",icon:"□",label:"Sandbox"},
      {id:"phonology",icon:"♪",label:"Phonology"},
      {id:"graph",icon:"∿",label:"Root Graph"},
      {id:"cases",icon:"▷",label:"Cases"},
    ]},
    {id:"nav-adv",label:"Advanced",items:[
      {id:"dialogue",icon:"~",label:"AI Dialogue"},
      {id:"future",icon:"⊙",label:"Future"},
      {id:"settings",icon:"⚙",label:"Settings"},
    ]},
  ];

  const viewTitles={framework:"Philosophical Framework",dashboard:"Progress Dashboard",puzzles:"Puzzle Hall",synesthetic:"Synesthetic Training",cdw:"Concept Decomposition Workspace",wde:"Word Deconstruction Engine",sandbox:"Morphological Sandbox",phonology:"Phonology Reference",graph:"Semantic Root Graph",cases:"Case Grammar Reference",dialogue:"Conceptual Dialogue Mode",future:"Future Features",settings:"Settings"};

  const renderView=()=>{
    if(view==="framework")  return <PhiloFramework/>;
    if(view==="dashboard")  return <Dashboard lm={lm} onNav={setView}/>;
    if(view==="phonology")  return <Phonology/>;;
    if(view==="puzzles")    return <PuzzleHall synOn={synOn} lm={lm} onXP={xp=>setLm(p=>({...p,xp:p.xp+xp}))} onLmUpdate={(paramKeys,correct)=>{
      setLm(prev=>{
        let n={...prev,
          totalAttempts:prev.totalAttempts+1,
          totalCorrect:prev.totalCorrect+(correct?1:0),
          xp:prev.xp+(correct?15:2),
          streak:correct?prev.streak+1:0,
        };
        paramKeys.forEach(pk=>{
          if(!PARAMS[pk])return;
          const vals=n[pk]||{};
          // Nudge all values gently in the right direction
          const updated={};
          Object.entries(vals).forEach(([vid,score])=>{
            updated[vid]=Math.min(1,Math.max(0,score+(correct?0.04:-0.01)));
          });
          n={...n,[pk]:updated};
          // SM-2 SRS: update all tracked values for this param
          Object.keys(vals).forEach(vid=>{ n=srsUpdate(n,pk,vid,correct); });
          // Module progress: increment toward 1.0 slowly
          const module=PUZZLE_REGISTRY[Object.entries(PARAM_DRILLS).find(([,ids])=>ids.includes(defId||''))?.[0]||'']?.module;
          if(module){
            const prev=n.moduleProgress[module]||0;
            n={...n,moduleProgress:{...n.moduleProgress,[module]:Math.min(1,prev+(correct?0.015:0))}};
          }
        });
        return n;
      });
    }}/>;
    if(view==="synesthetic")return <SynestheticTrainer synOn={synOn} setSynOn={setSynOn}/>;
    if(view==="cdw")        return <CDW params={sandboxParams} setParams={setSP} synOn={synOn}/>;
    if(view==="wde")        return <WDE synOn={synOn}/>;
    if(view==="sandbox")    return <Sandbox synOn={synOn}/>;
    if(view==="graph")      return <SemanticGraph/>;
    if(view==="cases")      return <CaseReference/>;
    if(view==="dialogue")   return <DialogueMode apiKey={apiKey}/>;
    if(view==="future")     return <FutureFeatures/>;
    if(view==="settings")   return <Settings apiKey={apiKey} setApiKey={setApiKey} synOn={synOn} setSynOn={setSynOn} tint={tint} setTint={setTint} brightness={brightness} setBrightness={setBrightness}/>;
  };

  return(
    <div style={{display:'flex',minHeight:'100vh'}}>
      {/* SIDEBAR — v1 style */}
      <div className="scroll-y" style={{width:180,background:'var(--surface)',borderRight:'1px solid var(--border)',display:'flex',flexDirection:'column',flexShrink:0,overflowY:'auto'}}>
        <div style={{padding:'20px 14px 16px',borderBottom:'1px solid var(--border)'}}>
          <h1 style={{fontSize:15,color:'var(--bright)',letterSpacing:'0.12em',lineHeight:1.2}}>MORPHOS</h1>
          <p style={{fontSize:9,color:'var(--muted)',letterSpacing:'0.06em',marginTop:2}}>ITHKUIL IV LEARNING SYSTEM</p>
          {synOn&&<div style={{marginTop:6,fontSize:9,color:'#16a34a',display:'flex',alignItems:'center',gap:4}}>
            <div style={{width:5,height:5,borderRadius:'50%',background:'#16a34a',animation:'pulse 1.5s infinite'}}/>synesthetic active
          </div>}
        </div>
        <nav style={{flex:1,padding:'8px 8px',display:'flex',flexDirection:'column',gap:2}}>
          {navSections.map(sec=>(
            <div key={sec.id}>
              <div className="nav-section">{sec.label}</div>
              {sec.items.map(item=>(
                <button key={item.id} onClick={()=>setView(item.id)}
                  style={{display:'flex',alignItems:'center',gap:8,padding:'7px 10px',borderRadius:6,border:'none',cursor:'pointer',textAlign:'left',fontFamily:'IBM Plex Sans,sans-serif',fontSize:12,fontWeight:view===item.id?600:400,background:view===item.id?'rgba(67,56,202,0.25)':'transparent',color:view===item.id?'var(--bright)':'var(--muted)',transition:'all 0.12s',width:'100%'}}>
                  <span style={{fontSize:11,opacity:0.8}}>{item.icon}</span>{item.label}
                </button>
              ))}
            </div>
          ))}
        </nav>
        <div style={{padding:'10px 14px',borderTop:'1px solid var(--border)'}}>
          <div style={{fontSize:10,color:'var(--muted)',marginBottom:4}}>Session XP</div>
          <div style={{fontSize:20,fontFamily:'Cinzel,serif',color:'#f59e0b'}}>{lm.xp}</div>
          <ProgressMeter value={Math.min(1,(lm.xp%200)/200)} color="#f59e0b"/>
          <div style={{marginTop:4,fontSize:10,color:'var(--muted)'}}>Level {calcStage(lm)}/4 · {lm.streak}🔥 streak</div>
        </div>
      </div>
      {/* MAIN */}
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0}}>
        <header style={{padding:'12px 24px',borderBottom:'1px solid var(--border)',background:'var(--surface)',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0}}>
          <div>
            <h2 style={{fontSize:15,color:'var(--bright)',fontFamily:'Cinzel,serif',letterSpacing:'0.06em'}}>{viewTitles[view]}</h2>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <InfoPill label="Streak" value={`${lm.streak}🔥`}/>
            <InfoPill label="Exercises" value={lm.totalAttempts}/>
            {(()=>{const nr=nextRecommendedPuzzle(lm);return nr?<button className="btn btn-ghost btn-sm" onClick={()=>{setView('puzzles');setTimeout(()=>window.dispatchEvent(new CustomEvent('launch-drill',{detail:{id:nr.id,def:nr.def}})),150);}} title={nr.reason} style={{fontSize:10,color:'var(--accent2)',borderColor:'var(--accent)44'}}>▶ Next</button>:null;})()}
            <div title={ik&&ik.loaded?'Live @zsnout/ithkuil':'Placeholder morphology'} style={{
              fontSize:9,fontWeight:700,letterSpacing:'.06em',textTransform:'uppercase',
              padding:'2px 6px',borderRadius:4,fontFamily:'IBM Plex Mono',cursor:'default',
              background:ik&&ik.loaded?'rgba(34,197,94,.15)':'rgba(110,112,153,.1)',
              color:ik&&ik.loaded?'#22c55e':'var(--muted)',
              border:'1px solid '+(ik&&ik.loaded?'#22c55e44':'var(--border)')}}>
              {ik&&ik.loaded?'● live':'○ local'}
            </div>
            <button className="btn btn-ghost btn-sm" onClick={()=>{
                const stops=[0,33,66,100];
                const cur=stops.reduce((a,b)=>Math.abs(b-brightness)<Math.abs(a-brightness)?b:a);
                setBrightness(stops[(stops.indexOf(cur)+1)%4]);
              }} style={{color:'var(--muted)',borderColor:'var(--border)',minWidth:36}}>
              {brightness<=16?"⬛":brightness<=50?"☾":brightness<=83?"◑":"☀"}
            </button>
            <button className="btn btn-ghost btn-sm" onClick={()=>setSynOn(v=>!v)}
              style={{background:synOn?'rgba(67,56,202,0.2)':'transparent',color:synOn?'#818cf8':'var(--muted)',borderColor:synOn?'#4338ca44':'var(--border)'}}>
              {synOn?"♪ on":"♪ off"}
            </button>
          </div>
        </header>
        <main className="scroll-y" style={{flex:1,padding:24,maxWidth:1100,width:'100%',margin:'0 auto',boxSizing:'border-box'}}>
          <div className="anim-fade" key={view}>{renderView()}</div>
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script type="module">
/* LAYER 20 — ZSNOUT LIVE ENGINE */
async function loadIK(){
  try{
    const[gen,parse,data,gloss]=await Promise.all([
      import('https://esm.sh/@zsnout/ithkuil/generate'),
      import('https://esm.sh/@zsnout/ithkuil/parse'),
      import('https://esm.sh/@zsnout/ithkuil/data'),
      import('https://esm.sh/@zsnout/ithkuil/gloss'),
    ]);
    window.IK={gen,parse,data,gloss,loaded:true,version:'live'};
    if(data&&data.roots){
      window.IK.rootIndex={};
      const src=Array.isArray(data.roots)?data.roots:Object.entries(data.roots);
      src.forEach(entry=>{
        const cr=Array.isArray(entry)?entry[0]:entry.cr;
        const info=Array.isArray(entry)?entry[1]:entry;
        if(cr)window.IK.rootIndex[cr.toLowerCase()]=info;
      });
    }
    window.dispatchEvent(new CustomEvent('ithkuil-loaded',{detail:{version:'live'}}));
    console.info('[MORPHOS] @zsnout/ithkuil loaded — live morphology active');
  }catch(e){
    console.warn('[MORPHOS] zsnout unavailable:',e&&e.message||String(e));
    window.IK={loaded:false,version:'placeholder'};
    window.dispatchEvent(new CustomEvent('ithkuil-loaded',{detail:{version:'placeholder'}}));
  }
}
loadIK();
window._pendingDrill=null;
window._launchPhonoDrill=function(id,def){
  window._pendingDrill={id,def};
  window.dispatchEvent(new CustomEvent('launch-drill',{detail:{id,def}}));
};
</script>
</body>
</html>
